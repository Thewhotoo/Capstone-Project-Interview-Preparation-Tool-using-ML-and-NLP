        function toggleRepoCard(index) {
            const card = document.getElementById(`repo-card-${index}`);
            const body = document.getElementById(`repo-body-${index}`);
            if (!card || !body) return;
            if (card.classList.contains("expanded")) {
                body.style.maxHeight = "0px";
                card.classList.remove("expanded");
            } else {
                card.classList.add("expanded");
                body.style.maxHeight = body.scrollHeight + "px";
            }
        }

        function renderTimelineCard(data) {
            // Label corrected to match what this card actually renders
            // (data.projects, below) -- it was previously titled "Experience
            // Timeline" despite never rendering `experience_detail` (the
            // candidate's real work-experience entries, e.g. CAVE Labs),
            // found during a real production demo. Smallest correct fix:
            // the label now matches its own data, not a redesign of what's
            // shown on this screen.
            const el = document.createElement("div");
            el.className = "dash-card";
            const projects = Array.isArray(data.projects) ? data.projects : [];
            let html = `<div class="brief-panel-label">Projects</div>`;
            if (projects.length === 0) {
                html += `<div style="color:var(--text-muted); font-size:0.85rem;">No projects detected in resume.</div>`;
            } else {
                html += projects.map((p, i) => renderRepoCard(p, i)).join("");
            }
            el.innerHTML = html;
            return el;
        }

        // Detected Skills + Detected Technologies merged into one panel —
        // the union of the resume's own skills list and every project's
        // technologies, deduplicated and grouped the same way as before.
        // A fixed-height, naturally scrollable panel (GitHub/Linear-style)
        // — same union-of-skills-and-technologies data as before, no
        // expand/collapse interaction needed.
        function renderTechnicalStackCard(data) {
            const el = document.createElement("div");
            el.className = "dash-card";
            const skills = Array.isArray(data.skills) ? data.skills : [];
            const projectTechs = collectProjectTechnologies(data);
            const combined = uniq([...skills, ...projectTechs]);
            const cats = categorizeSkills(combined);
            const chipClassMap = { "Languages": "sk-lang", "Frameworks": "sk-framework", "AI/ML": "sk-aiml", "Tools": "sk-tool", "Databases": "sk-db", "Cloud": "sk-cloud", "Other": "sk-other" };

            let inner = "";
            if (combined.length === 0) {
                inner = `<div style="color:var(--text-muted); font-size:0.85rem;">No technologies detected.</div>`;
            } else {
                for (const [cat, catSkills] of Object.entries(cats)) {
                    if (catSkills.length === 0) continue;
                    inner += `<div class="dash-category-label">${esc(cat)}</div>`;
                    inner += `<div class="dash-skills-grid">`;
                    for (const s of catSkills) inner += `<span class="skill-chip ${chipClassMap[cat] || ''}">${esc(s)}</span>`;
                    inner += `</div>`;
                }
            }
            el.innerHTML = `
                <div class="brief-panel-label">Technical Stack</div>
                <div class="brief-stack-body">${inner}</div>
            `;
            return el;
        }

        function renderBriefingCta() {
            const el = document.createElement("div");
            el.className = "brief-cta-wrap";
            el.id = "brief-cta-wrap";
            el.innerHTML = `<button class="dash-start-btn" onclick="startDomainDiscussionFromDashboard()">Enter Resume Discussion &rarr;</button>`;
            return el;
        }

        // The workspace entry point appears only once the briefing has
        // fully rendered — the AI summary finishes "writing" first.
        async function runBriefingSequence(data) {
            const summaryEl = document.getElementById("brief-summary-text");
            if (summaryEl) {
                await typeLine(summaryEl, buildAiSummaryText(data));
            }
            await wait(500);
            const ctaWrap = document.getElementById("brief-cta-wrap");
            if (ctaWrap) ctaWrap.classList.add("show");
        }

        function startDomainDiscussionFromDashboard() {
            // Re-entrancy guard (see rdSessionStarting's own declaration):
            // a click while startup is already in flight is a no-op, not a
            // second session.
            if (rdSessionStarting) return;
            rdSessionStarting = true;

            candidateDashboard.style.display = "none";
            landingContainer.style.display = "none";
            rdHistoryList.innerHTML = "";
            rdHistoryList.classList.remove("show");
            document.getElementById("rd-history-toggle").classList.remove("expanded");
            rdHistoryCount.textContent = "0";
            rdSeenCategories = [];
            rdChapterRail.innerHTML = "";
            rdQuestionNum = 0;
            rdStageWrap.classList.remove("transitioning");

            document.body.classList.add("rd-scroll-mode");
            rdContainer.style.display = "flex";
            rdContainer.style.opacity = "0";
            setTimeout(() => { rdContainer.style.opacity = "1"; }, 50);

            rdStartSession();
        }

        // ─── RESUME DISCUSSION — workspace helpers ─────────────────────
        // One stage is reused per turn (question + composer); history is
        // archived, not stacked. See design proposal for the rationale
        // behind departing from a chat-bubble model.
        const RD_CATEGORY_LABELS = {
            "project_overview": "Project Overview",
            "project_deep_dive": "Project Deep Dive",
            "skill_in_context": "Skill in Context",
            "experience": "Experience",
            "certification": "Certification",
        };

        function rdCategoryLabel(cat) {
            return RD_CATEGORY_LABELS[cat] || "Discussion";
        }

        // Contextual heading \u2014 a short label derived only from fields the
        // backend actually returns (project_reference / category /
        // source_id; see question_realizer.py's _project_reference and
        // conversation_engine.py's _question_payload). Never invents a
        // project/role/cert name that isn't in the payload. Follow-up is
        // rendered as its own small tag (see rdRenderStage), not folded
        // into this string.
        function rdContextHeadingFor(q) {
            if (q.project_reference) return q.project_reference;
            if (q.category === "experience") return q.source_id;
            if (q.category === "certification") return q.source_id;
            return "Your Background";
        }

        // Chapter rail \u2014 orientation only: only categories actually
        // encountered this session appear, in first-seen order. No fixed
        // roadmap, no completion percentage (topic_pool.py's ordering is
        // priority-scored, not a guaranteed sequence of blocks).
        function rdUpdateChapterRail(category) {
            if (!rdSeenCategories.includes(category)) rdSeenCategories.push(category);
            rdChapterRail.innerHTML = rdSeenCategories.map((cat) => {
                const isCurrent = cat === category;
                return `<div class="rd-chapter-item${isCurrent ? " current" : " visited"}">` +
                    `<span class="rd-chapter-dot"></span>${esc(rdCategoryLabel(cat))}</div>`;
            }).join("");
        }

        function rdUpdatePositionLabel(num, total) {
            rdPositionLabel.textContent = `Question ${num} of ~${total}`;
        }

        // Archive a completed turn into the secondary history record \u2014 a
        // plain transcript line, deliberately quiet, no evaluation data
        // (that stays report-only per the approved design).
        function rdArchiveTurn(turn) {
            const item = document.createElement("div");
            item.className = "rd-history-item";
            item.innerHTML =
                `<div class="rd-history-item-q">${esc(turn.question)}</div>` +
                `<div class="rd-history-item-a">${esc(turn.answer || "")}</div>`;
            rdHistoryList.appendChild(item);
            rdHistoryCount.textContent = String(rdHistoryList.children.length);
        }

        function rdToggleHistory() {
            const opening = !rdHistoryList.classList.contains("show");
            rdHistoryList.classList.toggle("show");
            document.getElementById("rd-history-toggle").classList.toggle("expanded");

            if (opening) {
                // Scroll once the expand transition has actually finished growing
                // the list, so the target position is the real final layout, not
                // a mid-animation guess.
                rdHistoryList.addEventListener("transitionend", function onExpand(e) {
                    if (e.propertyName !== "max-height") return;
                    rdHistoryList.removeEventListener("transitionend", onExpand);
                    document.getElementById("rd-history-wrap").scrollIntoView({ behavior: "smooth", block: "start" });
                });
            }
        }

        // ─── Voice input — a dedicated recognizer for the composer, kept
        // separate from the Adaptive Interview's `recognition`/`micBtn` so
        // the two flows never fight over the same handlers. Same Web
        // Speech API, same "listening" concept, just scoped to #rd-container. ───
        let rdRecognition = null;
        let rdIsRecording = false;

        if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            rdRecognition = new SR();
            rdRecognition.continuous = false;
            rdRecognition.interimResults = true;

            rdRecognition.onstart = () => {
                rdIsRecording = true;
                rdMicBtn.classList.add("mic-active");
                setSystemLog("Listening...");
            };
            rdRecognition.onresult = (event) => {
                let transcript = "";
                for (let i = 0; i < event.results.length; i++) transcript += event.results[i][0].transcript;
                rdInput.value = transcript;
                rdSendBtn.classList.toggle("ready", transcript.trim().length > 0);
            };
            rdRecognition.onerror = () => rdStopMic();
            rdRecognition.onend = () => rdStopMic();
        } else if (rdMicBtn) {
            rdMicBtn.style.display = "none";
        }

        function rdToggleMic() {
            if (!rdRecognition || rdInput.disabled) return;
            if (rdIsRecording) rdRecognition.stop();
            else rdRecognition.start();
        }

        function rdStopMic() {
            if (!rdRecognition || !rdIsRecording) return;
            rdIsRecording = false;
            rdMicBtn.classList.remove("mic-active");
            if (!rdInput.disabled) {
                setSystemLog("Awaiting your response.");
                rdInput.focus();
            }
        }

        function rdDisableInput() {
            rdInput.disabled = true;
            rdSendBtn.disabled = true;
            if (rdMicBtn) rdMicBtn.disabled = true;
            rdInput.placeholder = "Thinking...";
        }

        function rdEnableInput() {
            rdInput.disabled = false;
            rdSendBtn.disabled = false;
            if (rdMicBtn) rdMicBtn.disabled = false;
            rdInput.placeholder = "Share your answer...";
            rdInput.focus();
        }

        function rdHandleSubmission() {
            if (rdInput.disabled) return;
            const text = rdInput.value.trim();
            if (!text) return;
            if (rdIsRecording) rdStopMic();
            rdInput.value = "";
            rdSendBtn.classList.remove("ready");
            rdHandleReply(text);
        }

        rdInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") rdHandleSubmission();
        });
        rdInput.addEventListener("input", () => {
            rdSendBtn.classList.toggle("ready", rdInput.value.trim().length > 0);
        });

        // Renders the next turn onto the single, reused stage: the stage
        // fades out, the (short) context label swaps, the stage fades back
        // in, then the question types itself via `typeLine` -- the same
        // "AI composing" signal used on the landing page and Briefing.
        // The composer stays disabled until typing completes.
        async function rdRenderStage(question) {
            rdStageWrap.classList.add("transitioning");
            await sleep(320);

            const label = esc(rdContextHeadingFor(question));
            rdContextHeading.innerHTML = question.is_followup
                ? `${label} <span class="rd-followup-tag">Follow-up</span>`
                : label;
            rdQuestionTextEl.textContent = "";

            rdStageWrap.classList.remove("transitioning");
            await sleep(60);

            setSystemLog("Composing question...");
            await typeLine(rdQuestionTextEl, question.text);
            setSystemLog("Awaiting your response.");
            rdEnableInput();
        }

        function rdShowStageError(message) {
            rdStageWrap.classList.remove("transitioning");
            rdContextHeading.textContent = "";
            rdQuestionTextEl.textContent = message;
            rdDisableInput();
            rdInput.placeholder = "Share your answer...";
            setSystemLog("Waiting to continue.");
        }

        async function rdStartSession() {
            rdDisableInput();
            rdContextHeading.textContent = "";
            rdQuestionTextEl.textContent = "";
            setSystemLog("Preparing your first question...");

            const sessionId = parsedResumeData ? (parsedResumeData.session_id || "") : "";

            try {
                const res = await fetch("/api/resume-discussion-v2/start", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: sessionId })
                });
                const data = await res.json();

                if (data.error) {
                    rdShowStageError(data.error);
                    return;
                }

                // v2's response shape: {status, conversation_id, question,
                // total_questions}. total_questions is the REAL planned pool
                // size for this profile (Planner.total(), session 12) -- not
                // an estimate, and not a fixed ceiling; question_num comes
                // from the question's own turn_number.
                rdSessionId = data.conversation_id;
                rdTotalQuestions = data.total_questions;
                rdQuestionNum = data.question.turn_number;
                rdCurrentCategory = data.question.category;
                rdTurnHistory = [{
                    question: data.question.text, category: data.question.category,
                    project_reference: data.question.project_reference, is_followup: false,
                    turn_number: data.question.turn_number, answer: null, evaluation: null,
                }];

                setSystemLog("Composing question...");
                await typeLine(
                    rdQuestionTextEl,
                    "Let's talk through your background \u2014 I'll ask about your projects, experience, and technologies.",
                );
                await sleep(700);

                rdUpdatePositionLabel(rdQuestionNum, rdTotalQuestions);
                rdUpdateChapterRail(rdCurrentCategory);
                await rdRenderStage(data.question);

            } catch (err) {
                console.error("Discussion start error:", err);
                rdShowStageError("Failed to start the discussion. Please try again.");
            } finally {
                // Reset on every exit path (success, the data.error early
                // return, and the catch block) -- a failed startup must
                // never permanently lock out a legitimate retry.
                rdSessionStarting = false;
            }
        }

        async function rdHandleReply(answer) {
            rdDisableInput();

            // Archive the just-answered turn immediately -- the stage is
            // about to be reused for the next question, so the record of
            // this exchange moves to (secondary) history right away rather
            // than staying stacked on screen.
            const answeredTurn = rdTurnHistory[rdTurnHistory.length - 1];
            if (answeredTurn) {
                answeredTurn.answer = answer;
                rdArchiveTurn(answeredTurn);
            }

            setSystemLog("Processing your response...");

            try {
                const res = await fetch("/api/resume-discussion-v2/reply", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: rdSessionId, answer: answer })
                });
                const data = await res.json();

                if (data.error) {
                    rdShowStageError(data.error);
                    return;
                }

                // Record the real TrainedEvaluator result against the turn
                // just archived -- kept only for the end-of-session report
                // (rdBuildReportFromV2); never rendered during the live
                // conversation, per the approved design.
                if (answeredTurn) answeredTurn.evaluation = data.evaluation;

                if (data.is_completed) {
                    rdTriggerReport();
                    return;
                }

                if (data.next_question) {
                    // v2 has no top-level question_num/is_followup -- turn_number
                    // and next_question.is_followup are the equivalent fields.
                    rdQuestionNum = data.turn_number;
                    rdCurrentCategory = data.next_question.category;
                    rdUpdatePositionLabel(rdQuestionNum, rdTotalQuestions);
                    rdUpdateChapterRail(rdCurrentCategory);
                    rdTurnHistory.push({
                        question: data.next_question.text, category: data.next_question.category,
                        project_reference: data.next_question.project_reference,
                        is_followup: data.next_question.is_followup, turn_number: data.turn_number,
                        answer: null, evaluation: null,
                    });

                    await rdRenderStage(data.next_question);
                }

            } catch (err) {
                console.error("Discussion reply error:", err);
                rdShowStageError("Something went wrong processing that answer. Please try again.");
            }
        }

        async function rdTriggerReport() {
            rdDisableInput();
            rdStageWrap.classList.add("transitioning");
            setSystemLog("Building your report...");

            try {
                const res = await fetch("/api/resume-discussion-v2/end", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: rdSessionId })
                });
                const data = await res.json();
                await sleep(400);

                rdContainer.style.opacity = "0";
                await sleep(400);
                rdContainer.style.display = "none";
                document.body.classList.remove("rd-scroll-mode");

                // Defensive: this screen must never show a stale message
                // from an earlier screen (idle cycle, briefing build, etc.)
                // -- explicitly stop it and pin the log to this screen's own
                // real state before and after the report renders.
                stopIdleSystemLogCycle();
                await rdRenderReport(rdBuildReportFromV2(data, rdTurnHistory));
                setSystemLog("Resume discussion complete.");

            } catch (err) {
                console.error("Discussion end error:", err);
                rdShowStageError("Failed to generate your discussion report.");
            }
        }

        // ─── v1 -> v2 report adapter (frontend-only; no backend change) ───
        // Redesigned from first principles (see design doc): the report is
        // organized around the CANDIDATE's questions ("how did I do / what
        // should I improve / where specifically"), not around the backend's
        // field names. Every backend structure (dimensions, strengths,
        // weaknesses, missing_reasoning, concept_coverage,
        // recommended_topics) still feeds this -- but multiple fields that
        // describe the same underlying idea are SYNTHESIZED into one prose
        // insight instead of each getting its own section. Nothing is
        // invented; only how many sentences/sections a given set of real
        // signals produces is a frontend authoring decision.
        //
        // Returns null (not 0) when `name` wasn't a relevant dimension for
        // this turn's reasoning_type (reasoning_dimension_relevance.py --
        // e.g. technical_depth is only relevant for 5 of 10 reasoning
        // types). Session 13 calibration fix: treating "not scored" as a
        // score of 0 was silently deflating session-level averages for any
        // dimension that isn't ALWAYS_RELEVANT -- this was a frontend
        // aggregation bug, not the model being harsh. The model/evaluator
        // itself is unchanged; only how already-present per-turn results
        // are averaged is corrected here.
        function rdDimScore(evaluation, name) {
            const d = evaluation && (evaluation.dimensions || []).find(x => x.name === name);
            return d ? d.raw_score : null;
        }

        // Renders one metric box in the per-question detail grid, or
        // nothing at all when the dimension wasn't evaluated this turn
        // (null -- e.g. technical_depth doesn't apply to every reasoning
        // type). Mirrors the Performance Snapshot's own not-applicable
        // handling (rdBuildSnapshot: a row is omitted entirely, never
        // shown as 0%) rather than inventing a second convention here --
        // found during a real production demo: `(item.technical_depth ||
        // 0)` was rendering "0%" (a literal failing score) for a
        // dimension that was simply never assessed that turn.
        function rdMetricBoxHtml(label, value) {
            if (value === null || value === undefined) return "";
            return `<div><div class="rd-timeline-metric-label">${esc(label)}</div><div class="rd-timeline-metric-value">${(value * 100).toFixed(0)}%</div></div>`;
        }

        function rdAvgDimensionPct(evaluations, name) {
            const scored = evaluations.map(e => rdDimScore(e, name)).filter(v => v !== null);
            if (!scored.length) return 0;
            return (scored.reduce((a, b) => a + b, 0) / scored.length) * 100;
        }

        // All dimension averages that actually appeared this session
        // (as fractions 0-1) -- "authenticity" is excluded since it never
        // contributes to overall_score by design (reasoning_dimension_
        // relevance.py: diagnostic-only until independently validated).
        function rdAllDimensionAverages(evaluations) {
            const sums = {}, counts = {};
            evaluations.forEach(e => (e.dimensions || []).forEach(d => {
                if (d.name === "authenticity") return;
                sums[d.name] = (sums[d.name] || 0) + d.raw_score;
                counts[d.name] = (counts[d.name] || 0) + 1;
            }));
            const out = {};
            Object.keys(sums).forEach(name => { out[name] = sums[name] / counts[name]; });
            return out;
        }

        // ── Natural-language phrase banks: these translate real backend
        // signals (dimension name + strong/weak, missing_reasoning
        // category, grade band) into human sentences. The FACT behind each
        // phrase is always real (which dimension scored how, on which
        // topic); only the wording is authored here, same principle as
        // buildAiSummaryText/buildStrategyText on the Briefing screen. ──
        const RD_DIM_STRONG = {
            technical_accuracy: "your technical explanations held up well",
            technical_depth: "you went genuinely deep on the technical details",
            communication: "you explained things clearly",
            completeness: "your answers were thorough",
            resume_grounding: "everything you said tracked back to your resume",
            architecture: "you laid out how the pieces fit together clearly",
            tradeoffs: "you reasoned well about trade-offs",
            ownership: "you were clear about what you personally built",
            debugging: "you walked through your debugging process well",
            testing: "you spoke confidently about how you tested things",
            scalability: "you'd clearly thought about how it would scale",
        };
        const RD_DIM_WEAK_SENTENCE = {
            technical_accuracy: "A few technical details didn't quite hold up.",
            technical_depth: "Answers stayed fairly surface-level rather than going deep.",
            communication: "Explanations could have been more clearly structured.",
            completeness: "Answers left out detail that mattered.",
            resume_grounding: "A few claims didn't clearly connect back to your resume.",
            architecture: "The architecture explanation stayed vague.",
            tradeoffs: "The trade-offs behind your choices went unaddressed.",
            ownership: "It wasn't always clear what you personally owned versus the team.",
            debugging: "There wasn't much on how you actually debugged issues.",
            testing: "Testing didn't really come up.",
            scalability: "Scalability wasn't addressed.",
        };
        // Canonical dimension display order/labels -- the same closed set
        // RD_DIM_STRONG/RD_DIM_WEAK_SENTENCE above already enumerate
        // (heuristic_evaluator.py's full dimension taxonomy, minus
        // "authenticity" which rdAllDimensionAverages already excludes).
        // Reused by rdBuildSnapshot below so the Performance Snapshot
        // shows every dimension actually evaluated this session -- not a
        // hardcoded subset -- without needing a second list kept in sync.
        const RD_DIM_ORDER = Object.keys(RD_DIM_STRONG);
        const RD_DIM_LABELS = {
            technical_accuracy: "Technical Accuracy",
            technical_depth: "Technical Depth",
            communication: "Communication",
            completeness: "Completeness",
            resume_grounding: "Resume Grounding",
            architecture: "Architecture",
            tradeoffs: "Trade-offs",
            ownership: "Ownership",
            debugging: "Debugging",
            testing: "Testing",
            scalability: "Scalability",
        };
        // Same gap taxonomy strong_answer.py uses for the Improved Answer,
        // reworded here in second person for the interviewer's voice.
        const RD_GAP_CLAUSE = {
            tradeoff: "why you chose that approach over the alternatives",
            architecture: "how the pieces fit together",
            example: "a concrete example",
            testing: "how you verified it worked",
            debugging: "how you worked through the harder cases",
            metrics: "the results that showed it worked",
            edge_case: "the edge cases you handled",
            scalability: "how it would hold up at scale",
            design_decision: "the reasoning behind that decision",
            ownership: "which parts you personally owned",
            communication: "the explanation more clearly",
        };
        const RD_VERDICT_BY_GRADE = {
            excellent: "A strong, confident discussion overall.",
            good: "A solid discussion overall.",
            adequate: "A reasonable discussion, with room to grow.",
            weak: "A thin discussion that needs more depth next time.",
            poor: "A discussion that didn't fully land — worth another pass.",
        };
        const RD_TOPIC_NOTE_BY_GRADE = {
            excellent: "Clear ownership and technical confidence.",
            good: "Solid, confident answers throughout.",
            adequate: "Good overview, but technical justification could be stronger.",
            weak: "Answers stayed mostly high-level.",
            poor: "Struggled to move beyond a surface-level answer.",
        };

        // Before Your Next Interview -- deliberately a DIFFERENT phrase bank
        // from the Debrief's RD_GAP_CLAUSE (which are noun-clause fragments
        // like "how the pieces fit together"). These are imperative,
        // second-person coaching lines so the two sections don't just
        // repeat each other in different word order.
        const RD_ADVICE_BY_GAP = {
            tradeoff: "Practice explaining the trade-offs behind your technical choices, not just what you built.",
            architecture: "Be ready to walk through how the pieces of your system fit together, not just each one individually.",
            example: "Prepare a concrete example or two you can walk through in detail.",
            testing: "Be ready to explain how you verified your work actually worked.",
            debugging: "Practice narrating how you debug a hard problem, step by step.",
            metrics: "Have real numbers ready — what improved, and by how much.",
            edge_case: "Think through the edge cases before you're asked about them.",
            scalability: "Be ready to talk about how your solution would hold up at scale.",
            design_decision: "Practice justifying the reasoning behind your design decisions.",
            ownership: "Be clear about which parts were specifically yours.",
            communication: "Practice structuring your answers so the key point comes first.",
        };

        // UI-honesty fix (post-demo forensic investigation): the report used
        // to present strong_answer.py's output as one "Improved Answer" blob
        // -- but that blob is, and was always designed to be, the
        // candidate's OWN answer verbatim plus exactly one deterministic
        // coaching sentence (never a genuine rewrite -- no LLM, by design,
        // see strong_answer.py's own docstring). Live-reproduced: every
        // real turn in a 10-turn browser session retained 100% of the
        // candidate's wording. The label implied more than the mechanism
        // delivers, so the card now shows the two pieces honestly and
        // separately -- "Your Answer" (the candidate's real, unmodified
        // answer, already on the turn) and "Coaching Note"
        // (evaluation.coaching_note, computed server-side by
        // strong_answer.coaching_note from the exact same signals as
        // before -- missing_reasoning / grounded missing concepts -- just
        // exposed on its own instead of pre-concatenated). Both are null
        // together under the same hide conditions strong_answer.py has
        // always used (already-strong answer, or nothing concrete to add).
        // DeBERTa remains evaluation-only; no generation logic changed.
        // Same 5-band taxonomy the backend's own evaluator uses per turn
        // (heuristic_evaluator.py._grade thresholds) -- applied here to the
        // session average so the report's overall verdict uses the exact
        // same language the evaluator already speaks, not a re-invented one.
        function rdOverallGrade(avgFraction) {
            if (avgFraction >= 0.80) return "excellent";
            if (avgFraction >= 0.60) return "good";
            if (avgFraction >= 0.40) return "adequate";
            if (avgFraction >= 0.25) return "weak";
            return "poor";
        }

        // The Debrief -- the report's centerpiece. One flowing paragraph,
        // never a fixed sentence count: the shortest honest account of the
        // session. Every sentence is optional and only appears when there's
        // a real signal behind it; nothing pads it out to hit a target
        // length. Priority per sentence slot: strongest signal (anchored to
        // the strongest project when both exist) -> single lead growth
        // signal (a reasoning gap beats a merely-low dimension score, since
        // it names something concrete) -> trend (a genuinely separate,
        // temporal signal).
        function rdBuildDebrief(overallGrade, dimAverages, reasoningGaps, strongestProject, weakestProject, timeline) {
            const sentences = [];

            let bestDim = null, worstDim = null;
            Object.entries(dimAverages).forEach(([name, avg]) => {
                if (avg >= 0.65 && (!bestDim || avg > bestDim[1])) bestDim = [name, avg];
                if (avg <= 0.55 && (!worstDim || avg < worstDim[1])) worstDim = [name, avg];
            });

            if (strongestProject && bestDim && RD_DIM_STRONG[bestDim[0]]) {
                sentences.push(`Your discussion of the ${strongestProject} project was the high point of the session — ${RD_DIM_STRONG[bestDim[0]]}.`);
            } else if (bestDim && RD_DIM_STRONG[bestDim[0]]) {
                sentences.push(`Across the discussion, ${RD_DIM_STRONG[bestDim[0]]}.`);
            } else if (strongestProject) {
                sentences.push(`Your discussion of the ${strongestProject} project was the strongest part of the session.`);
            } else {
                sentences.push("This was a steady discussion without one section clearly pulling ahead of the rest.");
            }

            let growthSentence = null;
            if (reasoningGaps.length && RD_GAP_CLAUSE[reasoningGaps[0].category]) {
                const clause = RD_GAP_CLAUSE[reasoningGaps[0].category];
                growthSentence = (weakestProject && weakestProject !== strongestProject)
                    ? `In the ${weakestProject} discussion, where it thinned out was ${clause}.`
                    : `Where it thinned out was ${clause}.`;
            } else if (worstDim && RD_DIM_WEAK_SENTENCE[worstDim[0]]) {
                growthSentence = RD_DIM_WEAK_SENTENCE[worstDim[0]];
            }
            if (growthSentence) sentences.push(growthSentence);

            // PHASE 9 FIX (do not revert without re-reading the
            // investigation): this used to also add a "never came up"
            // sentence naming result.concept_coverage's omitted concepts --
            // removed for the same reason as rdBuildNextSteps above (see
            // that function's comment): concept_coverage is registry-
            // derived, not resume-text-grounded, and is not scoped to
            // whether it actually explains any turn's real weakness.
            // concept_coverage itself is untouched -- it remains valid
            // evaluator/dashboard data; it is just no longer narrated here
            // as a specific, personalized "this never came up" claim.

            if (timeline.length >= 4) {
                const mid = Math.floor(timeline.length / 2);
                const scoresOf = (arr) => arr.reduce((s, t) => s + t.score, 0) / Math.max(arr.length, 1);
                const firstHalf = scoresOf(timeline.slice(0, mid));
                const secondHalf = scoresOf(timeline.slice(mid));
                if (secondHalf - firstHalf >= 0.12) {
                    sentences.push("You settled in and got stronger as the conversation went on.");
                } else if (firstHalf - secondHalf >= 0.12) {
                    sentences.push("Your strongest moments came early, with a little less energy toward the end.");
                }
            }

            if (!growthSentence && sentences.length < 2) {
                sentences.push("There wasn't much to push back on here — a clean, confident discussion.");
            }

            return sentences.join(" ");
        }

        // Before Your Next Interview -- two DIFFERENT sources, each in its
        // own style, so the list never reads as one template repeated:
        //   1. behavioral advice for the lead reasoning gap (RD_ADVICE_BY_GAP)
        //   2. a project-specific "justify the choice" line, but ONLY when a
        //      tradeoff/design_decision gap actually evidences that this
        //      project's reasoning was the thin spot -- never presumed
        // Falls back to the backend's own recommended_topics only if neither
        // of the two real signals above produced anything (never empty AND
        // silent about a known gap).
        //
        // PHASE 9 FIX (do not revert without re-reading the investigation):
        // this used to also add "Review {missingConcepts} so they naturally
        // become part of future discussions" -- missingConcepts came from
        // result.concept_coverage's omitted list, which is populated purely
        // from expected_concepts_registry.py (a per-technology textbook
        // lookup, e.g. "fastapi" -> ASGI/dependency injection/routing), not
        // from anything the candidate's resume text, question, or answer
        // established (same root cause Phase 8 fixed for the Improved
        // Answer feature -- concept_coverage has no resume-grounded
        // counterpart to fall back to here, unlike proj.concepts server-
        // side). Live-reproduced: a session whose real, repeated weakness
        // was "no concrete example" / "unclear ownership" across 10/10 and
        // 2/10 turns still told the candidate to "Review ASGI, async
        // request handling, dependency injection" off the strength of a
        // single unrelated skill_in_context turn. concept_coverage remains
        // valid evaluator/dashboard data (untouched anywhere else) -- it is
        // simply no longer eligible to be presented as personalized
        // "go study this" coaching here.
        function rdBuildNextSteps(recommendedTopics, reasoningGaps, weakestProject, strongestProject) {
            const steps = [];

            if (reasoningGaps.length && RD_ADVICE_BY_GAP[reasoningGaps[0].category]) {
                steps.push(RD_ADVICE_BY_GAP[reasoningGaps[0].category]);
            }

            const hasTradeoffGap = reasoningGaps.some(g => g.category === "tradeoff" || g.category === "design_decision");
            if (hasTradeoffGap && weakestProject && weakestProject !== strongestProject) {
                steps.push(`Be ready to justify why you chose your approach for ${weakestProject} over the alternatives.`);
            }

            if (!steps.length && recommendedTopics.length) {
                recommendedTopics.slice(0, 3).forEach((topic) => {
                    steps.push(`Spend some time preparing a clear narrative around ${topic}.`);
                });
            }

            return steps.slice(0, 3);
        }

        // How Each Topic Went -- one line per project/category, purely for
        // orientation. Hidden entirely by the renderer when only one topic
        // was discussed (nothing to orient between).
        function rdBuildTopics(turnHistory) {
            const buckets = {};
            turnHistory.forEach((t) => {
                if (!t.evaluation) return;
                const key = t.project_reference || t.category;
                const label = t.project_reference || rdCategoryLabel(t.category);
                if (!buckets[key]) buckets[key] = { label, scores: [] };
                buckets[key].scores.push(t.evaluation.overall_score || 0);
            });
            const topics = Object.values(buckets).map((b) => ({
                label: b.label,
                avg: b.scores.reduce((a, c) => a + c, 0) / b.scores.length,
            }));
            let strongestLabel = null;
            if (topics.length > 1) {
                let best = topics[0];
                topics.forEach((t) => { if (t.avg > best.avg) best = t; });
                strongestLabel = best.label;
            }
            return topics.map((t) => ({
                label: t.label,
                note: RD_TOPIC_NOTE_BY_GRADE[rdOverallGrade(t.avg)],
                is_strongest: topics.length > 1 && t.label === strongestLabel,
            }));
        }

        // Performance Snapshot -- supporting evidence beneath the Debrief,
        // not a replacement for it. Every value here is a real per-session
        // average of an EvaluationResult dimension (or the shared concept-
        // coverage detector) already computed for the Debrief/dimAverages;
        // this just renders the same real numbers editorially. A row is
        // omitted entirely (never shown as 0%) when that dimension never
        // scored this session.
        function rdBuildSnapshot(avgOverallPct, dimAverages) {
            // Every dimension actually evaluated this session appears here
            // -- not a hardcoded 5-key subset (found during a real
            // production demo: Ownership scored 25%, the session's single
            // weakest dimension, explicitly named in the Debrief and Next
            // Steps, yet was invisible in this table because it wasn't one
            // of the 5 hardcoded keys). RD_DIM_ORDER is the same closed,
            // canonical dimension taxonomy RD_DIM_STRONG/RD_DIM_WEAK_SENTENCE
            // already enumerate -- a row is still omitted entirely (never
            // shown as 0%) when that dimension never scored this session,
            // exactly as before.
            const rows = [{ label: "Overall", value: avgOverallPct }];
            RD_DIM_ORDER.forEach((key) => {
                if (dimAverages[key] !== undefined) rows.push({ label: RD_DIM_LABELS[key], value: dimAverages[key] * 100 });
            });

            // PRODUCT DECISION (post-Phase-10, do not reopen without a new
            // explicit product requirement): Concept Coverage is
            // intentionally NOT rendered in this Snapshot. The Phase 10 fix
            // made the row's honesty problem (a sample-size-blind
            // percentage) visible rather than hidden -- e.g.
            // "Concept Coverage (1 of 10 turns): 0%" -- but even the honest
            // version was judged not useful enough to a candidate to keep
            // surfacing. This is a presentation-only removal: the
            // underlying signal (concept_analysis.py, EvaluationResult.
            // concept_coverage, concept_coverage_percent) is completely
            // untouched and still computed/sent by the backend every turn;
            // it simply isn't read into this row anymore. See git history
            // for the removed conceptCoverageAvg/conceptCoverageSampleSize
            // calculation this function used to take as parameters.
            return rows;
        }

        function rdBuildReportFromV2(endData, turnHistory) {
            const evaluations = turnHistory.map(t => t.evaluation).filter(Boolean);
            const uniq = (arr) => Array.from(new Set(arr));

            const avgFraction = evaluations.length
                ? evaluations.reduce((s, e) => s + (e.overall_score || 0), 0) / evaluations.length
                : 0;
            const avgOverall = avgFraction * 100;
            const overallGrade = rdOverallGrade(avgFraction);

            // Strongest/weakest project: grouped from this session's own
            // real per-turn scores, not fabricated.
            const byProject = {};
            turnHistory.forEach((t) => {
                if (!t.evaluation || !t.project_reference) return;
                (byProject[t.project_reference] = byProject[t.project_reference] || []).push(t.evaluation.overall_score || 0);
            });
            let strongestProject = null, weakestProject = null, bestAvg = -1, worstAvg = 2;
            Object.entries(byProject).forEach(([proj, scores]) => {
                const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
                if (avg > bestAvg) { bestAvg = avg; strongestProject = proj; }
                if (avg < worstAvg) { worstAvg = avg; weakestProject = proj; }
            });

            const timeline = turnHistory.map((t) => ({
                is_followup: t.is_followup,
                question_num: t.turn_number,
                category: t.category,
                score: t.evaluation ? t.evaluation.overall_score : 0,
                grade: t.evaluation ? t.evaluation.grade : "n/a",
                question: t.question,
                answer: t.answer || "",
                correctness: rdDimScore(t.evaluation, "technical_accuracy"),
                technical_depth: rdDimScore(t.evaluation, "technical_depth"),
                completeness: rdDimScore(t.evaluation, "completeness"),
                communication: rdDimScore(t.evaluation, "communication"),
                // EvaluationResult.strengths/weaknesses (evaluator.py) are
                // plain strings, not {claim} objects -- ".claim" on a string
                // is undefined, which nonEmptyStrings() then silently
                // filters out, so every per-turn strengths/weaknesses list
                // in the report was rendering empty. Use the strings as-is.
                strengths: t.evaluation ? t.evaluation.strengths : [],
                weaknesses: t.evaluation ? t.evaluation.weaknesses : [],
                // UI-honesty fix (post-demo forensic investigation):
                // `improved_answer` (candidate's own answer + one appended
                // coaching sentence, concatenated) was rendered under an
                // "Improved Answer" label that implied a rewritten answer --
                // confirmed live that every real turn retained 100% of the
                // candidate's own wording and only ever added one fixed
                // sentence. The card now shows the candidate's real answer
                // (`item.answer`, already present above) under "Your Answer"
                // and this `coaching_note` (the same appended sentence,
                // exposed on its own by strong_answer.coaching_note --
                // never re-derived by parsing improved_answer) under
                // "Coaching Note", as two honest, separate pieces. No
                // regeneration, no LLM -- purely presentation.
                coaching_note: (t.evaluation && t.evaluation.coaching_note) || null,
                // PHASE 11 FIX (do not revert without re-reading the
                // investigation): EvaluationResult.confidence_rationale was
                // already computed and sent by the backend on every turn
                // (conversation_engine._result_payload) but never reached
                // the UI -- every evaluation, low-confidence or high-
                // confidence, rendered identically. Deliberately NOT paired
                // with the raw `confidence` float here: the investigation
                // found confidence and confidence_rationale can describe
                // different aspects of the same computation (e.g. a ~44%
                // confidence value alongside rationale wording of "very high
                // combined confidence" -- see hybrid_evaluator.py's
                // _compute_confidence/_confidence_tier_label), and inventing
                // a frontend reconciliation of that relationship is out of
                // scope for a presentation-only phase. The rationale is
                // backend-authored prose that already contains the model
                // confidence, heuristic agreement, agreement band, and tier
                // wording in one coherent sentence -- render that as-is.
                confidence_rationale: (t.evaluation && t.evaluation.confidence_rationale) || null,
            }));

            // Reasoning gaps: EvaluationResult.missing_reasoning describes HOW
            // the candidate reasoned (missing trade-off discussion, no example,
            // etc.) -- kept the highest-severity instance per category across
            // the session, sorted by severity. Only the single lead gap drives
            // the Debrief/Next Steps; nothing here exposes the full list.
            const gapByCategory = {};
            evaluations.forEach(e => {
                (e.missing_reasoning || []).forEach(m => {
                    if (!gapByCategory[m.category] || m.severity > gapByCategory[m.category].severity) {
                        gapByCategory[m.category] = m;
                    }
                });
            });
            const reasoningGaps = Object.values(gapByCategory).sort((a, b) => b.severity - a.severity);

            // PHASE 9 FIX (do not revert without re-reading the
            // investigation): a "missing concepts" list used to be collected
            // here from EvaluationResult.concept_coverage's omitted entries
            // and woven into the Debrief/Next Steps as personalized "review
            // this" / "this never came up" prose. Removed: concept_coverage
            // is populated purely from expected_concepts_registry.py (a
            // per-technology textbook lookup keyed off the project's
            // technology names), not from the candidate's actual resume
            // text, and is not scoped to whether it explains any turn's real
            // weakness -- rdBuildNextSteps/rdBuildDebrief now rely solely on
            // reasoningGaps (EvaluationResult.missing_reasoning) for their
            // growth-signal sentence, which IS per-turn evaluator evidence
            // of why that turn scored low. concept_coverage itself is
            // untouched on the backend, but is no longer read into the
            // report at all here -- see rdBuildSnapshot's own PRODUCT
            // DECISION comment for the (separate, later) removal of its
            // Snapshot row.

            const recommendedTopics = uniq(evaluations.flatMap(e => e.recommended_topics || []));
            const dimAverages = rdAllDimensionAverages(evaluations);

            const totalQuestions = endData.total_questions || turnHistory.length;

            return {
                average_answer_quality: avgOverall,
                overall_grade: overallGrade,
                verdict_text: RD_VERDICT_BY_GRADE[overallGrade],
                debrief_text: rdBuildDebrief(overallGrade, dimAverages, reasoningGaps, strongestProject, weakestProject, timeline),
                snapshot: rdBuildSnapshot(avgOverall, dimAverages),
                next_steps: rdBuildNextSteps(recommendedTopics, reasoningGaps, weakestProject, strongestProject),
                topics: rdBuildTopics(turnHistory),
                total_questions: totalQuestions,
                timeline: timeline,
            };
        }

        async function rdRenderReport(data) {
            rdReportContainer.innerHTML = "";
            rdReportContainer.style.display = "flex";

            const avg = data.average_answer_quality || 0;
            const timeline = data.timeline || [];

            const snapshotHtml = (data.snapshot || []).map(row => `
                <div class="rd-snapshot-row">
                    <span class="rd-snapshot-label">${esc(row.label)}</span>

        function animateScore(elementId, targetScore, cardId) {
            const el = document.getElementById(elementId);
            const cardElement = document.getElementById(cardId);
            let iterations = 0;
            const maxIterations = 20;

            el.style.fontFamily = "'Roboto Mono', monospace";

            const interval = setInterval(() => {
                const randomScramble = (Math.random()).toFixed(2);
                el.innerText = randomScramble;

                if (iterations >= maxIterations) {
                    clearInterval(interval);
                    el.innerText = targetScore.toFixed(2);

                    if (targetScore >= 0.8) {
                        cardElement.classList.add('glow-excellent');
                        el.style.color = "#34d399";
                    } else if (targetScore >= 0.4) {
                        cardElement.classList.add('glow-mid');
                        el.style.color = "#fbbf24";
                    } else {
                        cardElement.classList.add('glow-fail');
                        el.style.color = "#fb7185";
                    }
                }
                iterations++;
            }, 40);
        }

        // ─── SPEECH RECOGNITION ─────────────────────────────────────────────
        let recognition;
        let isRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = function() {
                isRecording = true;
                micBtn.classList.add("mic-active");
                inputField.placeholder = "Listening...";
            };

            recognition.onresult = function(event) {
                let transcript = "";
                for (let i = 0; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                inputField.value = transcript;
            };

            recognition.onerror = function(event) { stopMic(); };
            recognition.onend = function() { stopMic(); };
        } else {
            micBtn.style.display = "none";
        }

        function toggleMic() {
            if (isRecording) { stopMic(); }
            else { if (recognition) recognition.start(); }

        function stopMic() {

        async function uploadResume() {
            
            const fileInput = document.getElementById("resume-file");
            const file = fileInput.files[0];
            
            if (!file) {
                showToast("Please select a resume file first.", "error");
                return;
            }

            // Show loading state
            const startBtns = document.querySelectorAll("#resume-upload-section .start-btn");
            startBtns.forEach(b => { b.disabled = true; b.textContent = "Analyzing..."; });

            try {
                const formData = new FormData();
                formData.append("file", file);

                const response = await fetch("/api/classify-resume", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (!response.ok || result.error) {
                    showToast(result.error || "Failed to analyze resume.", "error");
                    startBtns.forEach(b => { b.disabled = false; b.textContent = "Start Interview →"; });
                    return;
                }

                if (result.status === "success") {
                    showToast("Resume parsed successfully!", "success");
                    showCandidateDashboard(result);
                } else {
                    showToast("Unexpected response from server.", "error");
                    startBtns.forEach(b => { b.disabled = false; b.textContent = "Start Interview →"; });
                }
            } catch (err) {
                console.error("Upload error:", err);
                showToast("Network error. Please try again.", "error");
                startBtns.forEach(b => { b.disabled = false; b.textContent = "Start Interview →"; });
            }
        }

        async function loadDomainQuiz(domain, skills = []) {
            try {
                const sessionId = parsedResumeData ? (parsedResumeData.session_id || "") : "";
                const response = await fetch("/api/get-domain-quiz", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: sessionId, domain: domain, skills: skills })
                });

                const result = await response.json();
                
                if (result.status === "success" && result.quiz && result.quiz.length > 0) {
                    // Update total questions counter
                    const totalQs = result.total_questions || result.quiz.length;
                    document.getElementById("quiz-total").textContent = totalQs;
                    // Now display the quiz
                    displayQuiz(result.quiz);
                } else {
                    console.error("Invalid quiz response:", result);
                    alert("Error loading quiz. Check console.");
                }
            } catch (error) {
                console.error("Error loading quiz:", error);
                alert("Error loading quiz: " + error);
            }
        });

        function displayQuiz(questions) {

                return;

            container.innerHTML = "";
            quizAnswers = [];

            questions.forEach((q, index) => {

                    : `<span style="padding: 4px 10px; background: rgba(255,255,255,0.05); border-radius: 6px; border: 1px solid ${difficultyColor}; color: ${difficultyColor}; font-size: 0.75rem; font-weight: 600;">${q.difficulty}</span>`;

        function addMessage(text, sender, isHtml = false) {
            const wrapper = document.createElement("div");
            wrapper.className = `msg-wrapper ${sender}-wrapper`;

            const avatar = document.createElement("div");
            avatar.className = "avatar";
            avatar.innerHTML = sender === "bot" ? "AI" : "U";

            const msgDiv = document.createElement("div");
            msgDiv.className = `msg ${sender}-msg`;

            if (isHtml) {
                msgDiv.innerHTML = text;
            } else {
                let formattedText = text;
                msgDiv.innerHTML = formattedText.replace(/\n/g, "<br>");
            }

            wrapper.appendChild(avatar);
            wrapper.appendChild(msgDiv);
            messagesDiv.appendChild(wrapper);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

            const wrapper = document.createElement("div");
            wrapper.className = `msg-wrapper bot-wrapper`;

            messagesDiv.appendChild(wrapper);

        function triggerDashboard() {

                const totalQuestions = interviewHistory.length;

                let topicScores = {};
                interviewHistory.forEach(item => {
                    if (!topicScores[item.topic]) topicScores[item.topic] = { total: 0, count: 0 };
                    topicScores[item.topic].total += item.marks;
                    topicScores[item.topic].count += 1;

                let skillsHtml = "";
                for (const [topic, data] of Object.entries(topicScores)) {
                    let avgTopicScore = (data.total / data.count) * 10;

        async function loadQuestion() {
            disableInput();
            showTyping();

            const payload = { asked_ids: askedIds, difficulty: currentDifficulty, topic: selectedTopic };

            const res = await fetch("/api/next_question", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            await sleep(800);
            hideTyping();

            if (data.status === "completed" || askedIds.length >= 5) {
                triggerDashboard();
                return;
            }

            currentQuestionData = data.data;
            askedIds.push(currentQuestionData.sample_id);
            stage = "main_question";

            const diffBadge = `<span style="font-size: 0.65rem; border: 1px solid #333; padding: 4px 8px; border-radius: 4px; color: #aaa; text-transform: uppercase;">${currentDifficulty}</span>`;

            addMessage(`${diffBadge} <span style="font-size:0.65rem; color:#666; margin-left: 10px; text-transform: uppercase;">${currentQuestionData.topic}</span><br><br><strong style="font-family: 'Roboto Mono', monospace;">Q${askedIds.length}:</strong> ${currentQuestionData.question}`, "bot", true);

            enableInput();
        }

        async function handleSubmission() {
            if (inputField.disabled) return;

            const text = inputField.value.trim();
            if (!text) return;
            
            disableInput(); 
            addMessage(text, "user");
            inputField.value = "";

            addMessage(text, "user");

            if (stage === "main_question") {
                tempMainAnswer = text;
                stage = "fill_mask";

                showTyping();
                await sleep(1000);
                hideTyping();

                addMessage(`<span style="font-family: 'Roboto Mono', monospace; font-size: 0.85rem; color: #888;">// SYSTEM PROMPT</span><br>Complete the following definition:<br><br>${currentQuestionData.fill_mask.question}`, "bot", true);
                enableInput();
            }
            else if (stage === "fill_mask") {
                const payload = {
                    user_answer: tempMainAnswer,
                    reference_answer: currentQuestionData.reference_answer,
                    question: currentQuestionData.question,
                    user_fill_mask: text,
                    reference_fill_mask: currentQuestionData.fill_mask.answer,
                    fill_question: currentQuestionData.fill_mask.question
                };

                showTyping();

                const res = await fetch("/api/evaluate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();

                await sleep(1000);
                hideTyping();

                interviewHistory.push({
                    question: currentQuestionData.question,
                    topic: currentQuestionData.topic,
                    difficulty: currentDifficulty,
                    marks: result.marks,
                    feedback: result.feedback,
                    fillCorrect: result.fill_correct
                });

                const fillStatus = result.fill_correct ? "<span style='color:#34d399;'>✓ Correct</span>" : "<span style='color:#fb7185;'>✗ Incorrect</span>";

                let logicMessage = "";
                if (result.score >= 0.75) {
                    if (currentDifficulty === "easy") { currentDifficulty = "medium"; logicMessage = "Difficulty adjusted to Medium"; }
                    else if (currentDifficulty === "medium") { currentDifficulty = "hard"; logicMessage = "Difficulty adjusted to Hard"; }
                } else if (result.score <= 0.45) {
                    if (currentDifficulty === "hard") { currentDifficulty = "medium"; logicMessage = "Difficulty adjusted to Medium"; }
                    else if (currentDifficulty === "medium") { currentDifficulty = "easy"; logicMessage = "Difficulty adjusted to Easy"; }
                }

                const uniqueId = Date.now();
                const scoreSpanId = `score-val-${uniqueId}`;
                const cardId = `eval-card-${uniqueId}`;

                const resultHtml = `
                    <div class="eval-card" id="${cardId}">
                        <div class="eval-header">
                            <span class="badge" style="font-family: 'Roboto Mono', monospace;">Score: <span id="${scoreSpanId}">0.00</span></span>
                            <span class="badge" style="font-family: 'Roboto Mono', monospace;">Marks: ${result.marks}/10</span>
                        </div>
                        <div style="margin-bottom: 12px; color: #ddd;">
                            <strong>Main Answer:</strong> ${result.feedback}
                        </div>
                        <div style="margin-bottom: 12px; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 6px; border-left: 3px solid ${result.fill_correct ? '#34d399' : '#fb7185'}; color: #ddd;">
                            <strong>Fill-in-the-Blank:</strong> ${result.fill_feedback}
                        </div>
                        <div style="font-size: 0.75rem; color: #888; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;">
                            <div>Main: ${(result.main_score * 100).toFixed(0)}%</div>
                            <div>Blank: ${(result.fill_score * 100).toFixed(0)}%</div>
                        </div>
                        ${logicMessage ? `<div style="margin-top: 12px; font-size: 0.75rem; color: #666; font-family: 'Roboto Mono', monospace; text-transform: uppercase;">> Engine Log: ${logicMessage}</div>` : ''}
                    </div>
                `;

                addMessage(resultHtml, "bot", true);

                setTimeout(() => {
                    animateScore(scoreSpanId, result.score, cardId);
                }, 100);

                setTimeout(() => {
                    loadQuestion();
                }, 4000);
            }
        }

        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") handleSubmission();
        });
    </script>
</body>
</html>
