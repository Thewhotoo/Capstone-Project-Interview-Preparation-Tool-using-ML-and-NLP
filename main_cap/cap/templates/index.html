<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Interview System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        /* --- (same styles as before) --- */
        :root {
            --bg-base: #000000;
            --bg-elevated: #0a0a0a;
            --bot-bubble: rgba(20, 20, 20, 0.8);
            --user-bubble: rgba(255, 255, 255, 0.05);
            --accent: #3b82f6;
            --text-main: #fcfcfc;
            --text-muted: #888888;
            --border-subtle: rgba(255, 255, 255, 0.06);

            /* --- Phase 1 additive tokens (shared scale, does not
                 replace anything the other screens already use) ---
                 Graphite/charcoal neutrals + a single restrained lime
                 accent reserved for "the system is alive" moments only
                 (status, focus, active state) — never a fill color. */
            --border-hover: rgba(255, 255, 255, 0.16);
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-slow: cubic-bezier(0.22, 1, 0.36, 1);
            --text-dim: #55564d;
            --lime: #c8ff5e;
            --lime-dim: rgba(200, 255, 94, 0.14);
            --lime-border: rgba(200, 255, 94, 0.4);
        }
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 14px 20px; border-radius: 10px; font-size: 0.9rem; font-weight: 500; color: #fff; background: var(--bg-elevated); border: 1px solid var(--border-subtle); box-shadow: 0 8px 32px rgba(0,0,0,0.4); animation: toastIn 0.3s ease forwards; max-width: 360px; }
        .toast.toast-success { border-left: 3px solid #10b981; }
        .toast.toast-error { border-left: 3px solid #ef4444; }
        .toast.toast-info { border-left: 3px solid #3b82f6; }
        .toast.toast-out { animation: toastOut 0.3s ease forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(40px); } }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            height: 100vh;
            color: var(--text-main);
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 50% -20%, rgba(29, 78, 216, 0.15), transparent 50%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- LANDING PAGE --- */
        #landing-container {
            width: 100%;
            max-width: 500px;
            margin: auto; /* Centers it perfectly */
            text-align: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
            padding: 40px;
        }

        .landing-title { 
            font-size: 3rem; 
            font-weight: 700; 
            margin-bottom: 8px; 
            letter-spacing: -1px;
            color: #ffffff;
        }
        
        .landing-sub { color: var(--text-muted); margin-bottom: 40px; font-size: 1.1rem; font-weight: 300; }

        .form-group { text-align: left; margin-bottom: 24px; }
        .form-group label { display: block; font-size: 0.75rem; color: #666; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
        select { width: 100%; padding: 16px 20px; border-radius: 12px; background: var(--bg-elevated); border: 1px solid var(--border-subtle); color: white; font-size: 1rem; outline: none; transition: all 0.3s ease; appearance: none; }
        select:focus { border-color: #555; }
        option { background: var(--bg-elevated); color: white; }
        .start-btn { width: 100%; padding: 18px; margin-top: 20px; background: white; color: black; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .start-btn:hover { transform: scale(1.02); background: #f0f0f0; box-shadow: 0 0 30px rgba(255,255,255,0.1); }

        /* --- CANDIDATE ASSESSMENT DASHBOARD --- */
        #candidate-dashboard {
            display: none;
            width: 100%;
            height: 92vh;
            overflow-y: auto;
            background: var(--bg-base);
            animation: dashFadeIn 0.6s ease forwards;
        }
        #candidate-dashboard::-webkit-scrollbar { display: none; }
        @keyframes dashFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .dash-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 32px 60px;
        }

        .dash-greeting {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .dash-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 36px;
            font-weight: 400;
        }

        .dash-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }
        .dash-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 24px;
        }
        .dash-card-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }
        .dash-card-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            font-family: 'Roboto Mono', monospace;
        }
        .dash-card-value.small {
            font-size: 1rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
        }

        .dash-full { grid-column: 1 / -1; }
        .dash-skills-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .skill-chip { padding: 6px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 500; background: rgba(255,255,255,0.04); border: 1px solid var(--border-subtle); color: #ddd; }
        .skill-chip.sk-lang { background: rgba(59,130,246,0.10); border-color: rgba(59,130,246,0.20); color: #93c5fd; }
        .skill-chip.sk-framework { background: rgba(16,185,129,0.10); border-color: rgba(16,185,129,0.20); color: #6ee7b7; }
        .skill-chip.sk-tool { background: rgba(245,158,11,0.10); border-color: rgba(245,158,11,0.20); color: #fcd34d; }
        .skill-chip.sk-db { background: rgba(168,85,247,0.10); border-color: rgba(168,85,247,0.20); color: #c4b5fd; }
        .skill-chip.sk-cloud { background: rgba(6,182,212,0.10); border-color: rgba(6,182,212,0.20); color: #67e8f9; }
        .skill-chip.sk-other { background: rgba(255,255,255,0.04); border-color: var(--border-subtle); color: #aaa; }

        .dash-category-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin: 12px 0 6px;
            font-weight: 600;
        }

        .dash-preview-box {
            background: rgba(255,255,255,0.02);
            border: 1px dashed rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 18px 20px;
            margin-top: 12px;
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .dash-preview-box strong { color: #ddd; }

        .dash-start-btn {
            width: 100%;
            padding: 18px;
            margin-top: 10px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dash-start-btn:hover {
            transform: scale(1.015);
            box-shadow: 0 0 40px rgba(255,255,255,0.08);
            background: #f0f0f0;
        }

        @media (max-width: 700px) {
            .dash-grid { grid-template-columns: 1fr; }
            .dash-wrapper { padding: 24px 16px 40px; }
            .dash-greeting { font-size: 1.5rem; }
        }

        /* --- CHAT CONTAINER (FULL SCREEN LAYOUT) --- */
        #chat-container { 
            display: none; 
            width: 100%; 
            height: 100vh; 
            flex-direction: column; 
            align-items: center; /* Centers the inner content */
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .chat-header { 
            width: 100%;
            padding: 24px; 
            text-align: center; 
            border-bottom: 1px solid var(--border-subtle); 
            font-weight: 500; 
            font-size: 0.9rem; 
            letter-spacing: 2px; 
            text-transform: uppercase;
            color: var(--text-muted);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        
        /* Restricting the width of the messages to look like a neat column */
        #messages { 
            width: 100%; 
            max-width: 800px; 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 24px; 
            scroll-behavior: smooth; 
        }
        #messages::-webkit-scrollbar { display: none; } /* Clean, hidden scrollbar */

        .msg-wrapper { display: flex; gap: 16px; max-width: 85%; animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .bot-wrapper { align-self: flex-start; }
        .user-wrapper { align-self: flex-end; flex-direction: row-reverse; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; background: var(--bg-elevated); border: 1px solid var(--border-subtle); flex-shrink: 0; }
        .msg { padding: 16px 20px; border-radius: 16px; line-height: 1.6; font-size: 0.95rem; font-weight: 400; }
        .bot-msg { background: var(--bot-bubble); border: 1px solid var(--border-subtle); }
        .user-msg { background: var(--user-bubble); border: 1px solid var(--border-subtle); }

        /* THE NEW EVALUATION CARD WITH GLASSMORPHISM */
        .eval-card { 
            background: rgba(10, 10, 10, 0.6); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 12px; 
            padding: 20px; 
            margin-top: 12px; 
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        /* PREMIUM DYNAMIC GLOWS */
        .glow-excellent {
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.1), inset 0 0 20px rgba(16, 185, 129, 0.05);
            border-color: rgba(16, 185, 129, 0.2);
        }
        .glow-mid {
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.1), inset 0 0 20px rgba(245, 158, 11, 0.05);
            border-color: rgba(245, 158, 11, 0.2);
        }
        .glow-fail {
            box-shadow: 0 0 40px rgba(225, 29, 72, 0.1), inset 0 0 20px rgba(225, 29, 72, 0.05);
            border-color: rgba(225, 29, 72, 0.2);
        }

        .eval-header { display: flex; justify-content: space-between; margin-bottom: 16px; font-weight: 500; }
        .badge { background: rgba(255,255,255,0.03); padding: 6px 14px; border-radius: 8px; font-size: 0.85rem; border: 1px solid var(--border-subtle); letter-spacing: 0.5px; }
        .typing-indicator { display: flex; gap: 6px; padding: 18px 24px; background: var(--bot-bubble); border-radius: 16px; width: fit-content; border: 1px solid var(--border-subtle); }
        .dot { width: 6px; height: 6px; background-color: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* THE NEW INPUT AREA */
        .input-area { 
            width: 100%; 
            max-width: 800px; 
            display: flex; 
            gap: 12px; 
            padding: 20px; 
            padding-bottom: 40px; /* Gives it breathing room at the bottom of the screen */
            background: transparent; 
        }
        
        input[type="text"] { 
            flex-grow: 1; 
            padding: 16px 24px; 
            border-radius: 12px; 
            border: 1px solid var(--border-subtle); 
            background: var(--bg-elevated); 
            color: white; 
            font-size: 1rem; 
            outline: none; 
            transition: all 0.3s ease; 
        }
        input[type="text"]:focus { 
            border-color: #555; 
            background: #111; 
        }
        input[type="text"]:disabled { opacity: 0.5; cursor: not-allowed; }
        .mic-btn, .send-btn { padding: 0 24px; background: var(--bg-elevated); color: white; border: 1px solid var(--border-subtle); border-radius: 12px; cursor: pointer; font-size: 1rem; font-weight: 500; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .mic-btn:hover:not(:disabled), .send-btn:hover:not(:disabled) { background: #1a1a1a; border-color: #555; }
        .mic-active { color: #ef4444; border-color: rgba(239, 68, 68, 0.5) !important; background: rgba(239, 68, 68, 0.1) !important; }
        #dashboard-container { display: none; width: 100%; max-width: 800px; margin: auto; height: 90vh; flex-direction: column; overflow-y: auto; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; padding: 40px 20px; }
        #dashboard-container::-webkit-scrollbar { display: none; }

        .dashboard-header { 
            font-size: 2.5rem; 
            font-weight: 700; 
            margin-bottom: 40px; 
            color: #ffffff; 
            letter-spacing: -1px;
        }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 50px; }
        
        .stat-box { 
            background: var(--bg-elevated);
            padding: 30px 20px; 
            border-radius: 12px; 
            border: 1px solid var(--border-subtle); 
        }
        .stat-value { font-size: 3rem; font-weight: 700; margin-bottom: 8px; line-height: 1; font-family: 'Roboto Mono', monospace; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; }
        .section-title { font-weight: 600; margin-bottom: 24px; font-size: 1.2rem; color: #fff; letter-spacing: 1px; }
        .history-list { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .history-card { 
            background: var(--bg-elevated); 
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid var(--border-subtle); 
        }
        
        .history-card-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
        .history-q { font-weight: 500; font-size: 1.1rem; margin-bottom: 16px; color: #fff; line-height: 1.6; }
        .history-feedback { margin-top: 16px; font-size: 0.9rem; color: #aaa; background: rgba(0,0,0,0.3); padding: 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.02); }
        .skill-bar-container { margin-bottom: 20px; }
        .skill-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; color: #ccc; }
        .skill-bar-bg { width: 100%; height: 6px; background: #111; border-radius: 10px; overflow: hidden; }
        .skill-bar-fill { height: 100%; background: #fff; border-radius: 10px; transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1); }
        .retry-btn { margin: 40px 0; padding: 16px 30px; background: white; color: black; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; width: fit-content; }
        .retry-btn:hover { transform: scale(1.02); background: #f0f0f0; }

        /* ═══════════════════════════════════════════════════════════════
           RESUME DISCUSSION (dedicated — isolated from #chat-container /
           #dashboard-container above, which the Technical/Adaptive
           Interview owns exclusively). Reuses .msg / .avatar / .msg-wrapper
           / .typing-indicator / .input-area / .retry-btn from above for
           visual consistency, since those are generic, not interview-
           specific — only the container, state and behavior are separate.
           ═══════════════════════════════════════════════════════════════ */
        /* ═══════════════════════════════════════════════════════════════
           RESUME DISCUSSION — "workspace" model, not a chat log. One stage
           is reused turn over turn (question + composer); the previous
           turn retires into a secondary, collapsed history archive rather
           than stacking as a visible bubble. See session_handover.md /
           design proposal for the full rationale.
           ═══════════════════════════════════════════════════════════════ */
        #rd-container {
            display: none;
            width: 100%;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s var(--ease-slow);
        }

        #rd-header {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 24px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        #rd-header-title {
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        #rd-position-label {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 0.3px;
        }

        /* Chapter rail — orientation only, never a gamified tracker: no
           connecting line or fill bar implying a fixed itinerary or percent
           complete. Only categories actually encountered this session
           appear, in the order first seen (real data, never a precomputed
           roadmap the Planner doesn't guarantee — see topic_pool.py's
           priority-scored, non-blocked ordering). */
        #rd-chapter-rail {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .rd-chapter-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.68rem;
            letter-spacing: 0.3px;
            color: var(--text-dim);
            transition: color 0.5s var(--ease-slow);
        }
        .rd-chapter-dot {
            width: 5px; height: 5px; border-radius: 50%;
            background: var(--text-dim);
            transition: background 0.5s var(--ease-slow), box-shadow 0.5s var(--ease-slow);
        }
        .rd-chapter-item.current { color: var(--text-main); }
        .rd-chapter-item.current .rd-chapter-dot { background: var(--lime); box-shadow: 0 0 6px rgba(200,255,94,0.55); }
        .rd-chapter-item.visited .rd-chapter-dot { background: var(--text-muted); }

        /* ─── The stage: no card, no border — the question sits directly in
             the environment like the landing headline does. Generous
             whitespace is what makes it the focal point, not a container. ─── */
        #rd-stage-wrap {
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 64px 24px 48px;
            transition: opacity 0.5s var(--ease-slow), transform 0.5s var(--ease-slow);
        }
        #rd-stage-wrap.transitioning { opacity: 0; transform: translateY(12px); }
        .rd-context-heading {
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 28px;
            text-align: center;
            min-height: 1.2em;
        }
        .rd-followup-tag {
            display: inline-block;
            margin-left: 8px;
            color: #f59e0b;
            font-weight: 500;
        }
        #rd-stage {
            width: 100%;
            text-align: center;
        }
        .rd-question-text {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 2.4rem;
            font-weight: 400;
            line-height: 1.5;
            color: var(--text-main);
            margin: 0 0 52px;
            min-height: 1.5em;
        }
        .rd-question-text.type-caret::after {
            content: ""; display: inline-block; width: 2px; height: 0.85em; margin-left: 2px;
            background: rgba(255,255,255,0.7); vertical-align: -0.08em;
            animation: caretBlink 0.9s steps(1) infinite;
        }
        #rd-composer {
            display: flex;
            gap: 10px;
            max-width: 520px;
            margin: 0 auto;
        }
        #rd-composer input[type="text"] {
            flex: 1;
            background: transparent;
            border-color: var(--border-subtle);
        }
        .rd-icon-btn {
            flex-shrink: 0;
            width: 48px; height: 48px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-elevated);
            color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.3s var(--ease-slow);
        }
        .rd-icon-btn:hover:not(:disabled) { border-color: var(--border-hover); color: var(--text-main); }
        .rd-icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .rd-icon-btn svg { width: 18px; height: 18px; }
        .rd-send.ready { border-color: var(--lime-border); color: var(--lime); background: var(--lime-dim); }

        /* ─── Discussion Archive: a distinct section, not a continuation of
             the composer. Large vertical separation (whitespace, not a
             rule line) marks the boundary; collapsed state is just a
             centered pill with no transcript content until expanded. When
             expanded it uses a wider measure than the question stage, so
             it reads as reference material rather than part of the active
             turn. ─── */
        #rd-history-wrap {
            width: 100%;
            max-width: 1280px;
            margin: 160px auto 0;
            /* Generous bottom clearance -- the fixed bottom-left AI status
               widget (.system-log) is a viewport-fixed overlay, so however
               far this section scrolls, nothing here should ever end up
               directly behind it. */
            padding: 0 24px 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #rd-history-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 0.3px;
            padding: 10px 22px;
            transition: color 0.3s var(--ease-slow), border-color 0.3s var(--ease-slow);
        }
        #rd-history-toggle:hover { color: var(--text-muted); border-color: var(--border-hover); }
        .rd-history-caret {
            display: inline-block;
            font-size: 0.6rem;
            transition: transform 0.3s var(--ease-slow);
        }
        #rd-history-toggle.expanded .rd-history-caret { transform: rotate(180deg); }
        #rd-history-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            margin-top: 0;
            transition: max-height 0.6s var(--ease-slow), opacity 0.4s var(--ease-slow), margin-top 0.5s var(--ease-slow);
        }
        #rd-history-list.show { max-height: 4000px; opacity: 1; margin-top: 36px; }
        .rd-history-item {
            font-size: 0.85rem;
            line-height: 1.65;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .rd-history-item:last-child { border-bottom: none; padding-bottom: 0; }
        .rd-history-item-q { color: var(--text-muted); margin-bottom: 5px; }
        .rd-history-item-a { color: var(--text-dim); }

        /* ─── Resume Discussion report screen ─── */
        #rd-report-container {
            display: none;
            width: 100%;
            max-width: 860px;
            margin: auto;
            height: 92vh;
            flex-direction: column;
            overflow-y: auto;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            padding: 48px 24px 24px;
        }
        #rd-report-container::-webkit-scrollbar { display: none; }

        /* ═══════════════════════════════════════════════════════════════
           RESUME DISCUSSION REPORT — a debrief, not a dashboard, not an API
           viewer. Five sections, one idea each: Verdict (reaction) -> The
           Debrief (the narrative, the centerpiece) -> Before Your Next
           Interview (action) -> How Each Topic Went (light orientation,
           one line per topic) -> Discussion Record (collapsed reference).
           Color stays a single restrained lime accent throughout; quality
           is conveyed through prose, never hue or chip taxonomies.
           ═══════════════════════════════════════════════════════════════ */
        .rd-report-eyebrow {
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 14px;
        }
        .rd-verdict-text {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 1.7rem;
            font-weight: 400;
            line-height: 1.5;
            color: var(--text-main);
            margin: 0 0 12px;
            min-height: 1.5em;
        }
        .rd-verdict-text.type-caret::after {
            content: ""; display: inline-block; width: 2px; height: 0.85em; margin-left: 2px;
            background: rgba(255,255,255,0.7); vertical-align: -0.08em;
            animation: caretBlink 0.9s steps(1) infinite;
        }

        /* Quiet score caption -- one line, one number, never repeated
           elsewhere in the report. */
        .rd-score-line {
            display: flex; align-items: center; gap: 10px;
            font-size: 0.85rem; color: var(--text-muted);
            margin-bottom: 56px; opacity: 0; transition: opacity 0.6s var(--ease-slow);
        }
        .rd-score-line.show { opacity: 1; }
        .rd-score-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 6px rgba(200,255,94,0.6); flex-shrink: 0; }
        .rd-score-value { font-family: 'Roboto Mono', monospace; color: var(--text-main); font-weight: 600; }

        /* Everything after the score line fades in together, once, after a
           short pause -- see the entrance sequence in rdRenderReport. */
        #rd-report-body { opacity: 0; transition: opacity 0.7s var(--ease-slow); }
        #rd-report-body.show { opacity: 1; }

        .rd-section-title { font-weight: 600; font-size: 0.95rem; letter-spacing: 0.3px; color: var(--text-main); margin: 0 0 16px; }

        /* Performance Snapshot -- supporting evidence beneath the Debrief's
           narrative, presented editorially: a plain label/value list, no
           cards, no bars, no color coding. Real per-session averages only,
           each row omitted entirely when that dimension never scored this
           session rather than showing a misleading 0%. */
        .rd-snapshot-list { display: flex; flex-direction: column; margin: 0 0 56px; }
        .rd-snapshot-row {
            display: flex; justify-content: space-between; align-items: baseline;
            font-size: 0.92rem; padding: 11px 0; border-bottom: 1px solid var(--border-subtle);
        }
        .rd-snapshot-row:first-child { padding-top: 0; }
        .rd-snapshot-row:last-child { border-bottom: none; padding-bottom: 0; }
        .rd-snapshot-label { color: var(--text-muted); }
        .rd-snapshot-value { font-family: 'Roboto Mono', monospace; color: var(--text-main); font-weight: 600; }

        /* The Debrief -- the centerpiece. One flowing paragraph, serif for
           the same "considered, human" register as the verdict, generously
           spaced. Not a bullet list. */
        .rd-debrief-text {
            font-family: 'Newsreader', Georgia, serif;
            font-size: 1.25rem;
            font-weight: 400;
            line-height: 1.75;
            color: var(--text-main);
            margin: 0 0 56px;
        }

        /* Before Your Next Interview -- action items, plain list, medium
           emphasis (second most important section after the Debrief). */
        .rd-next-list { margin: 0 0 56px; padding-left: 20px; font-size: 0.98rem; color: var(--text-main); line-height: 1.8; }

        /* How Each Topic Went -- deliberately the lightest section: a name
           and one line, nothing else. No cards, no scores, no chips. */
        .rd-topics-list { display: flex; flex-direction: column; gap: 18px; margin-bottom: 56px; }
        .rd-topic-name { font-size: 0.82rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
        .rd-topic-note { font-size: 0.92rem; color: var(--text-muted); line-height: 1.6; }

        /* Closing transition into the next stage. */
        .rd-transition-card {
            border-left: 2px solid var(--lime-border);
            padding: 4px 0 4px 20px;
            margin-bottom: 40px;
        }
        .rd-transition-title { font-size: 0.95rem; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
        .rd-transition-text { font-size: 0.88rem; color: var(--text-muted); line-height: 1.6; }

        /* Discussion Record -- collapsed reference material, same idiom as
           the live Discussion's archive toggle. */
        .rd-record-toggle {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 999px;
            cursor: pointer; font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.3px;
            padding: 10px 22px; margin-bottom: 40px;
            transition: color 0.3s var(--ease-slow), border-color 0.3s var(--ease-slow);
        }
        .rd-record-toggle:hover { color: var(--text-muted); border-color: var(--border-hover); }
        .rd-record-caret { display: inline-block; font-size: 0.6rem; transition: transform 0.3s var(--ease-slow); }
        .rd-record-toggle.expanded .rd-record-caret { transform: rotate(180deg); }
        .rd-timeline-wrap {
            max-height: 0; overflow: hidden; opacity: 0; margin-top: 0;
            /* flex-shrink:0 -- #rd-report-container is a bounded-height
               (92vh) column flex container; without this, this element's
               own overflow:hidden makes its flexbox automatic min-height
               resolve to 0, so it gets shrunk to nothing regardless of
               max-height once total content exceeds the container height. */
            flex-shrink: 0;
            transition: max-height 0.6s var(--ease-slow), opacity 0.4s var(--ease-slow), margin-top 0.5s var(--ease-slow);
        }
        .rd-timeline-wrap.show { max-height: 6000px; opacity: 1; margin-top: 8px; margin-bottom: 40px; }
        .rd-timeline-card { border-bottom: 1px solid var(--border-subtle); padding: 18px 0; cursor: pointer; }
        .rd-timeline-card:last-child { border-bottom: none; }
        .rd-timeline-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
        .rd-timeline-grade { font-family: 'Roboto Mono', monospace; color: var(--text-muted); }
        .rd-timeline-q { font-size: 0.95rem; font-weight: 500; color: var(--text-main); margin-bottom: 8px; line-height: 1.5; }
        .rd-timeline-a { font-size: 0.85rem; color: var(--text-muted); line-height: 1.6; }
        .rd-timeline-detail { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-subtle); }
        .rd-timeline-detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
        .rd-timeline-metric-label { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 3px; }
        .rd-timeline-metric-value { font-family: 'Roboto Mono', monospace; color: var(--text-main); }
        .rd-timeline-list { margin: 0 0 10px; padding-left: 18px; font-size: 0.85rem; color: var(--text-main); }
        /* UI-spacing fix (Coaching Note / Your Answer breathing room):
           padding, line-height and radius nudged up so this reads as a
           supporting-feedback callout, not a second cramped answer box --
           see rd-timeline-metric-label's inline margin-bottom (Coaching
           Note's own label, below) and .rd-timeline-a's inline
           margin-bottom (Your Answer block, below) for the two other
           spacing values this pairs with. Content/color/logic unchanged. */
        .rd-suggested-answer { font-size: 0.85rem; color: var(--text-main); background: var(--lime-dim); padding: 16px 18px; border-radius: 10px; border-left: 3px solid var(--lime); line-height: 1.6; }
        /* Phase 11: explanatory (not actionable) supporting context, so it
           deliberately does NOT reuse .rd-suggested-answer's accent styling
           -- plain muted text, same border-left convention as the rest of
           the detail card, no color implying "do this". */
        .rd-confidence-rationale { font-size: 0.8rem; color: var(--text-muted); padding: 10px 14px; border-radius: 8px; border-left: 3px solid var(--border-subtle); line-height: 1.5; margin-top: 10px; }
        .rd-expand-hint { font-size: 0.68rem; color: var(--text-dim); margin-top: 10px; text-align: center; }

        .rd-report-actions { display: flex; gap: 16px; margin: 8px 0 40px; }
        .rd-report-btn {
            flex: 1; padding: 16px 24px; border-radius: 12px; font-size: 0.95rem; font-weight: 500;
            cursor: pointer; text-align: center; transition: all 0.3s var(--ease-slow);
            background: transparent; border: 1.5px solid var(--border-hover); color: var(--text-muted);
        }
        .rd-report-btn:hover { border-color: var(--text-muted); color: var(--text-main); }
        .rd-report-btn.primary { border-color: var(--lime-border); color: var(--text-main); box-shadow: 0 0 0 1px var(--lime-dim); }
        .rd-report-btn.primary:hover { box-shadow: 0 0 0 1px var(--lime-dim), 0 12px 30px -18px rgba(200,255,94,0.3); }

        @media (max-width: 640px) {
            .rd-timeline-detail-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>

            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add("toast-out");
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ─── XSS ESCAPE HELPER ──────────────────────────────────────────────
        function esc(str) {
            if (str == null) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ─── EMPTY-VALUE FILTERING (report generation hardening) ──────
        // Strips null/undefined/whitespace-only entries before a list is
        // turned into HTML, so a report section never renders a blank
        // bullet point. A field's own producer (heuristic_evaluator.py /
        // model_evaluator.py) already validates its own output can't be
        // blank, but this is defense-in-depth against any future
        // evaluator implementation, partial data, or edge case that isn't
        // covered by that validation.
        function nonEmptyStrings(list) {
            return (list || []).filter((s) => typeof s === "string" && s.trim().length > 0);

            },
            "Databases": {
                exact: ["mysql","postgresql","postgres","sqlite","mongodb","mongo","redis","elasticsearch","elastic","cassandra","dynamodb","dynamo","couchdb","couchbase","neo4j","firebase","supabase","mariadb","oracle","sql server","mssql","cosmosdb","cosmos","influxdb","riak","memcached","etcd","cockroachdb","clickhouse","snowflake","bigquery","redshift","hbase","couchdb","realm","prisma","sequelize","typeorm","sqlalchemy","mongoose","knex","hibernate"],
                substring: ["mysql","postgresql","postgres","sqlite","mongodb","redis","elasticsearch","cassandra","dynamodb","couchdb","couchbase","neo4j","firebase","supabase","mariadb","oracle","cosmos","influx","riak","memcached","etcd","cockroach","clickhouse","snowflake","bigquery","redshift","hbase","realm","prisma","sequelize","typeorm","sqlalchemy","mongoose","knex","hibernate"]
            },
            "Cloud": {
                exact: ["aws","amazon web services","ec2","s3","lambda","ecs","eks","rds","sqs","sns","cloudfront","route53","azure","microsoft azure","gcp","google cloud","google cloud platform","heroku","netlify","vercel","digitalocean","linode","vultr","cloudflare","cloudrun","cloud functions","pubsub","bigtable","dataflow","dataproc","sagemaker","bedrock","openai api"],
                substring: ["aws","ec2","s3","lambda","ecs","eks","rds","sqs","sns","cloudfront","route53","azure","gcp","heroku","netlify","vercel","digitalocean","linode","cloudflare","cloudrun","sagemaker","bedrock"]
            }
        };

        function categorizeSkills(skills) {
            const result = {
                "Languages": [],
                "Frameworks": [],
                "AI/ML": [],
                "Tools": [],
                "Databases": [],
                "Cloud": [],
                "Other": []
            };
            if (!Array.isArray(skills)) return result;

            const matched = new Set();

            for (const skill of skills) {
                const sLower = skill.toLowerCase().trim();
                let placed = false;

                for (const [cat, rules] of Object.entries(SKILL_CATEGORIES)) {
                    if (rules.exact.some(e => sLower === e.toLowerCase())) {
                        result[cat].push(skill);
                        matched.add(sLower);
                        placed = true;
                        break;
                    }
                }
                if (placed) continue;

                for (const [cat, rules] of Object.entries(SKILL_CATEGORIES)) {
                    if (rules.substring.some(s => sLower.includes(s) || s.includes(sLower))) {
                        result[cat].push(skill);
                        matched.add(sLower);
                        placed = true;
                        break;
                    }
                }
                if (placed) continue;

                result["Other"].push(skill);
            }
            return result;
        }

        // ─── CANDIDATE ASSESSMENT DASHBOARD RENDER FUNCTIONS ───────────

        function showCandidateDashboard(data) {
            parsedResumeData = data;

            // Hide landing, show dashboard
            landingContainer.style.opacity = "0";
            setTimeout(() => {
                landingContainer.style.display = "none";
                candidateDashboard.style.display = "block";

            dashWrapper.innerHTML = "";
            dashWrapper.appendChild(renderBriefingHeader(data));
            dashWrapper.appendChild(renderBriefingGrid(data));
            dashWrapper.appendChild(renderBriefingCta());

        }

        function renderBriefingHeader(data) {
            const el = document.createElement("div");
            el.className = "brief-header";
            const name = esc(data.name || "Candidate");
            const level = data.experience && data.experience.level ? esc(data.experience.level) : "";
            const domain = esc(data.predicted_domain || "Software Engineering");
            const subline = level ? `${level} &middot; ${domain}` : domain;
            el.innerHTML = `
                <div class="brief-eyebrow-row">
                    <div class="brief-eyebrow"><span class="eyebrow-dot"></span>Interview Briefing</div>
                    <div class="brief-pill">Profile generated</div>
                </div>
                <div class="brief-name">${name}</div>
                <div class="brief-subline">${subline}</div>
                <p class="brief-context">Your resume has been analysed. The interview below will be personalised around the projects, technologies and experience detected in your resume.</p>
            `;
            return el;
        }

        // Flat 5-card grid, in reading order, so CSS grid auto-flows it
        // into exactly the requested 2 rows:
        //   Row 1: Candidate Profile | AI Summary | AI Interview Strategy
        //   Row 2: Experience Timeline (spans 2) | Technical Stack
        function renderBriefingGrid(data) {
            const el = document.createElement("div");
            el.className = "brief-grid";
            el.appendChild(renderCandidateProfileCard(data));
            el.appendChild(renderAiSummaryCard());
            el.appendChild(renderStrategyCard(data));
            el.appendChild(renderTimelineCard(data));
            el.appendChild(renderTechnicalStackCard(data));

        }

        // Topics merged into the strategy card itself, as a compact
        // "Focus Areas" chip row — same real skills/technologies as
        // before, just no longer a separate panel.
        function getFocusTopics(data) {
            // Project technologies FIRST, generic resume skills fill any
            // remaining slots -- project technologies are what the
            // interview questions are actually grounded in (topic_pool.py
            // draws project_deep_dive/skill_in_context questions from
            // projects[].technologies), so they must survive the 8-item
            // cap ahead of a long generic skills list. Found during a real
            // production demo: with skills listed first, a 44-skill resume
            // meant the briefing's own "Focus Areas" preview never showed
            // the technologies (React/FastAPI/LangGraph) the interview
            // actually asked about -- only generic languages (Python/Java/
            // C++/C) that happened to sort earlier in the resume's own
            // skills list.
            const skills = Array.isArray(data.skills) ? data.skills : [];
            const allTechs = collectProjectTechnologies(data);
            return uniq([...allTechs, ...skills]).slice(0, 8);
        }

        function renderCandidateProfileCard(data) {
            const el = document.createElement("div");
            el.className = "dash-card";

            const domain = esc(data.predicted_domain || "N/A");
            const years = data.experience ? (data.experience.years || 0) : 0;
            const level = esc(data.experience ? (data.experience.level || "Unknown") : "Unknown");
            const education = Array.isArray(data.education) && data.education.length > 0
                ? data.education.map(e => esc(typeof e === "string" ? e : (e.degree || e.major || JSON.stringify(e)))).join(", ")
                : "Not detected";
            const contactParts = [];
            if (data.email) contactParts.push(esc(data.email));
            if (data.phone) contactParts.push(esc(data.phone));
            const contact = contactParts.length > 0 ? contactParts.join(" &middot; ") : "Not detected";

            el.innerHTML = `
                <div class="brief-panel-label">Candidate Profile</div>
                <dl class="brief-dl">
                    <dt>Domain</dt><dd>${domain}</dd>
                    <dt>Experience</dt><dd>${years} yr${years === 1 ? "" : "s"} &middot; ${level}</dd>
                    <dt>Education</dt><dd>${education}</dd>
                    <dt>Contact</dt><dd>${contact}</dd>
                </dl>
            `;
            return el;
        }

        function renderAiSummaryCard() {
            const el = document.createElement("div");
            el.className = "dash-card";
            el.innerHTML = `
                <div class="brief-panel-label">AI Summary</div>
                <p class="brief-summary-text" id="brief-summary-text"></p>
            `;
            return el;
        }

        function renderStrategyCard(data) {
            const el = document.createElement("div");
            el.className = "dash-card";
            const topics = getFocusTopics(data);
            const chipsHtml = topics.length
                ? topics.map(t => `<span class="brief-topic-chip">${esc(t)}</span>`).join("")
                : `<div style="color:var(--text-muted); font-size:0.8rem;">Not enough resume content to project focus areas.</div>`;
            el.innerHTML = `
                <div class="brief-panel-label">AI Interview Strategy</div>
                <p class="brief-strategy-text">${esc(buildStrategyText(data))}</p>
                <div class="brief-focus-label">Focus Areas</div>
                <div>${chipsHtml}</div>
            `;
            return el;
        }

        // Compact by default — title + category only. Clicking expands
        // the summary/tech chips smoothly (measured max-height, no
        // nested scrollbar) rather than truncating with an internal scroll.
        function renderRepoCard(project, index) {
            const title = esc(project.title || "Untitled Project");
            const summary = esc(project.summary || "");
            const techs = Array.isArray(project.technologies) ? project.technologies : [];
            const category = esc(deriveProjectCategory(project));
            return `
                <div class="brief-repo-card" id="repo-card-${index}">
                    <div class="brief-repo-head" onclick="toggleRepoCard(${index})">
                        <div class="brief-repo-title">${title}</div>
                        <div class="brief-repo-head-right">
                            <div class="brief-repo-category">${category}</div>
                            <span class="brief-repo-chevron">&#8250;</span>
                        </div>
                    </div>
                    <div class="brief-repo-body" id="repo-body-${index}">
                        <div class="brief-repo-body-inner">
                            ${summary ? `<div class="brief-repo-summary-full">${summary}</div>` : ""}
                            ${techs.length ? `<div class="brief-repo-chips">${techs.map(t => `<span class="skill-chip sk-lang">${esc(t)}</span>`).join("")}</div>` : ""}
                        </div>
