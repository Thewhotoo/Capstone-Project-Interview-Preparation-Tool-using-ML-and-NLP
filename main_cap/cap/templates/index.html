<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Pure black and ultra-dark grays for that sleek look */
            --bg-base: #000000;
            --bg-elevated: #0a0a0a;
            --bot-bubble: rgba(20, 20, 20, 0.8);
            --user-bubble: rgba(255, 255, 255, 0.05);
            --accent: #3b82f6;
            --text-main: #fcfcfc;
            --text-muted: #888888;
            --border-subtle: rgba(255, 255, 255, 0.06);
        }

        /* --- TOAST NOTIFICATIONS --- */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #fff;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            animation: toastIn 0.3s ease forwards;
            max-width: 360px;
        }
        .toast.toast-success { border-left: 3px solid #10b981; }
        .toast.toast-error { border-left: 3px solid #ef4444; }
        .toast.toast-info { border-left: 3px solid #3b82f6; }
        .toast.toast-out { animation: toastOut 0.3s ease forwards; }
        @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(40px); } }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            height: 100vh;
            color: var(--text-main);
            background-color: var(--bg-base);
            /* Subtle top-down glow so it's not totally flat */
            background-image: radial-gradient(circle at 50% -20%, rgba(29, 78, 216, 0.15), transparent 50%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- LANDING PAGE --- */
        #landing-container {
            width: 100%;
            max-width: 500px;
            margin: auto; /* Centers it perfectly */
            text-align: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
            padding: 40px;
        }

        .landing-title { 
            font-size: 3rem; 
            font-weight: 700; 
            margin-bottom: 8px; 
            letter-spacing: -1px;
            color: #ffffff;
        }
        
        .landing-sub { color: var(--text-muted); margin-bottom: 40px; font-size: 1.1rem; font-weight: 300; }

        .form-group { text-align: left; margin-bottom: 24px; }
        .form-group label { 
            display: block; 
            font-size: 0.75rem; 
            color: #666; 
            margin-bottom: 12px; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-weight: 600; 
        }
        
        select {
            width: 100%; 
            padding: 16px 20px; 
            border-radius: 12px; 
            background: var(--bg-elevated); 
            border: 1px solid var(--border-subtle); 
            color: white; 
            font-size: 1rem; 
            outline: none; 
            transition: all 0.3s ease;
            appearance: none;
        }
        select:focus { border-color: #555; }
        option { background: var(--bg-elevated); color: white; }

        .start-btn {
            width: 100%; 
            padding: 18px; 
            margin-top: 20px; 
            background: white; 
            color: black; 
            border: none; 
            border-radius: 12px; 
            font-size: 1.1rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .start-btn:hover { transform: scale(1.02); background: #f0f0f0; box-shadow: 0 0 30px rgba(255,255,255,0.1); }

        /* --- CANDIDATE ASSESSMENT DASHBOARD --- */
        #candidate-dashboard {
            display: none;
            width: 100%;
            height: 92vh;
            overflow-y: auto;
            background: var(--bg-base);
            animation: dashFadeIn 0.6s ease forwards;
        }
        #candidate-dashboard::-webkit-scrollbar { display: none; }
        @keyframes dashFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .dash-wrapper {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 32px 60px;
        }

        .dash-greeting {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .dash-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 36px;
            font-weight: 400;
        }

        .dash-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
        }
        .dash-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 24px;
        }
        .dash-card-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }
        .dash-card-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            font-family: 'Roboto Mono', monospace;
        }
        .dash-card-value.small {
            font-size: 1rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            line-height: 1.5;
        }

        .dash-full { grid-column: 1 / -1; }

        .dash-skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .skill-chip {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border-subtle);
            color: #ddd;
        }
        .skill-chip.sk-lang { background: rgba(59,130,246,0.10); border-color: rgba(59,130,246,0.20); color: #93c5fd; }
        .skill-chip.sk-framework { background: rgba(16,185,129,0.10); border-color: rgba(16,185,129,0.20); color: #6ee7b7; }
        .skill-chip.sk-tool { background: rgba(245,158,11,0.10); border-color: rgba(245,158,11,0.20); color: #fcd34d; }
        .skill-chip.sk-db { background: rgba(168,85,247,0.10); border-color: rgba(168,85,247,0.20); color: #c4b5fd; }
        .skill-chip.sk-cloud { background: rgba(6,182,212,0.10); border-color: rgba(6,182,212,0.20); color: #67e8f9; }
        .skill-chip.sk-other { background: rgba(255,255,255,0.04); border-color: var(--border-subtle); color: #aaa; }

        .dash-category-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin: 12px 0 6px;
            font-weight: 600;
        }

        .dash-preview-box {
            background: rgba(255,255,255,0.02);
            border: 1px dashed rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 18px 20px;
            margin-top: 12px;
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .dash-preview-box strong { color: #ddd; }

        .dash-start-btn {
            width: 100%;
            padding: 18px;
            margin-top: 10px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dash-start-btn:hover {
            transform: scale(1.015);
            box-shadow: 0 0 40px rgba(255,255,255,0.08);
            background: #f0f0f0;
        }

        @media (max-width: 700px) {
            .dash-grid { grid-template-columns: 1fr; }
            .dash-wrapper { padding: 24px 16px 40px; }
            .dash-greeting { font-size: 1.5rem; }
        }

        /* --- CHAT CONTAINER (FULL SCREEN LAYOUT) --- */
        #chat-container { 
            display: none; 
            width: 100%; 
            height: 100vh; 
            flex-direction: column; 
            align-items: center; /* Centers the inner content */
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .chat-header { 
            width: 100%;
            padding: 24px; 
            text-align: center; 
            border-bottom: 1px solid var(--border-subtle); 
            font-weight: 500; 
            font-size: 0.9rem; 
            letter-spacing: 2px; 
            text-transform: uppercase;
            color: var(--text-muted);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        
        /* Restricting the width of the messages to look like a neat column */
        #messages { 
            width: 100%; 
            max-width: 800px; 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 24px; 
            scroll-behavior: smooth; 
        }
        #messages::-webkit-scrollbar { display: none; } /* Clean, hidden scrollbar */

        .msg-wrapper { display: flex; gap: 16px; max-width: 85%; animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .bot-wrapper { align-self: flex-start; }
        .user-wrapper { align-self: flex-end; flex-direction: row-reverse; }

        .avatar { 
            width: 36px; 
            height: 36px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 1rem; 
            background: var(--bg-elevated); 
            border: 1px solid var(--border-subtle); 
            flex-shrink: 0; 
        }
        
        .msg { 
            padding: 16px 20px; 
            border-radius: 16px; 
            line-height: 1.6; 
            font-size: 0.95rem; 
            font-weight: 400;
        }
        
        .bot-msg { background: var(--bot-bubble); border: 1px solid var(--border-subtle); }
        .user-msg { background: var(--user-bubble); border: 1px solid var(--border-subtle); }

        /* THE NEW EVALUATION CARD WITH GLASSMORPHISM */
        .eval-card { 
            background: rgba(10, 10, 10, 0.6); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 12px; 
            padding: 20px; 
            margin-top: 12px; 
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        /* PREMIUM DYNAMIC GLOWS */
        .glow-excellent {
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.1), inset 0 0 20px rgba(16, 185, 129, 0.05);
            border-color: rgba(16, 185, 129, 0.2);
        }
        .glow-mid {
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.1), inset 0 0 20px rgba(245, 158, 11, 0.05);
            border-color: rgba(245, 158, 11, 0.2);
        }
        .glow-fail {
            box-shadow: 0 0 40px rgba(225, 29, 72, 0.1), inset 0 0 20px rgba(225, 29, 72, 0.05);
            border-color: rgba(225, 29, 72, 0.2);
        }

        .eval-header { display: flex; justify-content: space-between; margin-bottom: 16px; font-weight: 500; }
        .badge { 
            background: rgba(255,255,255,0.03); 
            padding: 6px 14px; 
            border-radius: 8px; 
            font-size: 0.85rem; 
            border: 1px solid var(--border-subtle); 
            letter-spacing: 0.5px;
        }

        .typing-indicator { display: flex; gap: 6px; padding: 18px 24px; background: var(--bot-bubble); border-radius: 16px; width: fit-content; border: 1px solid var(--border-subtle); }
        .dot { width: 6px; height: 6px; background-color: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* THE NEW INPUT AREA */
        .input-area { 
            width: 100%; 
            max-width: 800px; 
            display: flex; 
            gap: 12px; 
            padding: 20px; 
            padding-bottom: 40px; /* Gives it breathing room at the bottom of the screen */
            background: transparent; 
        }
        
        input[type="text"] { 
            flex-grow: 1; 
            padding: 16px 24px; 
            border-radius: 12px; 
            border: 1px solid var(--border-subtle); 
            background: var(--bg-elevated); 
            color: white; 
            font-size: 1rem; 
            outline: none; 
            transition: all 0.3s ease; 
        }
        input[type="text"]:focus { 
            border-color: #555; 
            background: #111; 
        }
        input[type="text"]:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .mic-btn, .send-btn { 
            padding: 0 24px; 
            background: var(--bg-elevated); 
            color: white; 
            border: 1px solid var(--border-subtle); 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 1rem; 
            font-weight: 500; 
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        .mic-btn:hover:not(:disabled), .send-btn:hover:not(:disabled) { background: #1a1a1a; border-color: #555; }
        .mic-active { color: #ef4444; border-color: rgba(239, 68, 68, 0.5) !important; background: rgba(239, 68, 68, 0.1) !important; }

        /* --- DASHBOARD UI --- */
        #dashboard-container { 
            display: none; 
            width: 100%; 
            max-width: 800px; 
            margin: auto; /* Centers it perfectly */
            height: 90vh; 
            flex-direction: column; 
            overflow-y: auto; 
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
            padding: 40px 20px;
        }
        #dashboard-container::-webkit-scrollbar { display: none; }

        .dashboard-header { 
            font-size: 2.5rem; 
            font-weight: 700; 
            margin-bottom: 40px; 
            color: #ffffff; 
            letter-spacing: -1px;
        }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 50px; }
        
        .stat-box { 
            background: var(--bg-elevated);
            padding: 30px 20px; 
            border-radius: 12px; 
            border: 1px solid var(--border-subtle); 
        }
        .stat-value { font-size: 3rem; font-weight: 700; margin-bottom: 8px; line-height: 1; font-family: 'Roboto Mono', monospace; }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; }
        
        .section-title { font-weight: 600; margin-bottom: 24px; font-size: 1.2rem; color: #fff; letter-spacing: 1px;}
        .history-list { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .history-card { 
            background: var(--bg-elevated); 
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid var(--border-subtle); 
        }
        
        .history-card-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
        .history-q { font-weight: 500; font-size: 1.1rem; margin-bottom: 16px; color: #fff; line-height: 1.6; }
        .history-feedback { margin-top: 16px; font-size: 0.9rem; color: #aaa; background: rgba(0,0,0,0.3); padding: 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.02); }

        .skill-bar-container { margin-bottom: 20px; }
        .skill-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; color: #ccc; }
        .skill-bar-bg { width: 100%; height: 6px; background: #111; border-radius: 10px; overflow: hidden; }
        .skill-bar-fill { height: 100%; background: #fff; border-radius: 10px; transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1); }

        .retry-btn { 
            margin: 40px 0; 
            padding: 16px 30px; 
            background: white; 
            color: black; 
            border: none; 
            border-radius: 12px; 
            font-size: 1rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            width: fit-content;
        }
        .retry-btn:hover { transform: scale(1.02); background: #f0f0f0; }

        /* ═══════════════════════════════════════════════════════════════
           RESUME DISCUSSION (dedicated — isolated from #chat-container /
           #dashboard-container above, which the Technical/Adaptive
           Interview owns exclusively). Reuses .msg / .avatar / .msg-wrapper
           / .typing-indicator / .input-area / .retry-btn from above for
           visual consistency, since those are generic, not interview-
           specific — only the container, state and behavior are separate.
           ═══════════════════════════════════════════════════════════════ */
        #rd-container {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        #rd-header {
            width: 100%;
            padding: 22px 24px 18px;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        #rd-header-title {
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 14px;
            text-align: center;
        }
        #rd-progress-track {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            overflow: hidden;
        }
        #rd-progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            border-radius: 4px;
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #rd-progress-label {
            max-width: 640px;
            margin: 8px auto 0;
            font-size: 0.72rem;
            color: var(--text-muted);
            text-align: center;
            letter-spacing: 0.5px;
        }

        #rd-messages {
            width: 100%;
            max-width: 800px;
            flex-grow: 1;
            overflow-y: auto;
            padding: 36px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }
        #rd-messages::-webkit-scrollbar { display: none; }

        .rd-category-tag {
            display: inline-block;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent);
            border: 1px solid rgba(59,130,246,0.35);
            background: rgba(59,130,246,0.08);
            padding: 3px 9px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .rd-category-tag.followup {
            color: #f59e0b;
            border-color: rgba(245,158,11,0.35);
            background: rgba(245,158,11,0.08);
        }

        /* ─── Resume Discussion report screen ─── */
        #rd-report-container {
            display: none;
            width: 100%;
            max-width: 860px;
            margin: auto;
            height: 92vh;
            flex-direction: column;
            overflow-y: auto;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            padding: 48px 24px 24px;
        }
        #rd-report-container::-webkit-scrollbar { display: none; }

        .rd-report-eyebrow {
            font-size: 0.72rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .rd-report-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
            color: #fff;
            margin-bottom: 36px;
        }

        .rd-section-title { font-weight: 600; font-size: 1.05rem; letter-spacing: 0.5px; color: #fff; margin: 8px 0 18px; }

        .rd-skillbar { margin-bottom: 18px; }
        .rd-skillbar-head { display: flex; justify-content: space-between; font-size: 0.85rem; color: #ccc; margin-bottom: 8px; }
        .rd-skillbar-track { width: 100%; height: 6px; background: #111; border-radius: 10px; overflow: hidden; }
        .rd-skillbar-fill { height: 100%; border-radius: 10px; transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1); }

        .rd-project-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 40px; }
        .rd-project-card { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 20px; }
        .rd-project-card.strongest { border-color: rgba(52,211,153,0.35); }
        .rd-project-card.weakest { border-color: rgba(251,113,133,0.35); }
        .rd-project-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 8px; }
        .rd-project-name { font-size: 1.05rem; font-weight: 600; }

        .rd-chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 36px; }
        .rd-chip { font-size: 0.78rem; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-subtle); background: rgba(255,255,255,0.03); }
        .rd-chip.mastered { color: #34d399; border-color: rgba(52,211,153,0.3); }
        .rd-chip.review { color: #fbbf24; border-color: rgba(251,191,36,0.3); }

        .rd-timeline-card { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 20px 24px; margin-bottom: 14px; cursor: pointer; }
        .rd-timeline-head { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .rd-timeline-grade { font-family: 'Roboto Mono', monospace; font-weight: 600; }
        .rd-timeline-q { font-size: 1.02rem; font-weight: 500; color: #fff; margin-bottom: 10px; line-height: 1.5; }
        .rd-timeline-a { font-size: 0.88rem; color: #aaa; line-height: 1.55; }
        .rd-timeline-detail { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }
        .rd-timeline-detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
        .rd-timeline-metric-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
        .rd-timeline-metric-value { font-family: 'Roboto Mono', monospace; }
        .rd-timeline-list { margin: 0 0 10px; padding-left: 18px; font-size: 0.85rem; }
        .rd-suggested-answer { font-size: 0.85rem; color: #93c5fd; background: rgba(59,130,246,0.05); padding: 12px 14px; border-radius: 8px; border-left: 3px solid var(--accent); line-height: 1.5; }

             strengths/improve columns, authenticity/feedback/focus cards ─── */

        .rd-metric-card { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 16px 14px; }
        .rd-metric-value { font-family: 'Roboto Mono', monospace; font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }

        .rd-columns-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 40px; }
        .rd-column-card { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 20px 22px; }
        .rd-column-card.strengths { border-color: rgba(52,211,153,0.3); }
        .rd-column-card.improve { border-color: rgba(251,191,36,0.3); }
        .rd-column-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
        .rd-column-card.strengths .rd-column-title { color: #34d399; }
        .rd-column-card.improve .rd-column-title { color: #fbbf24; }
        .rd-column-list { margin: 0; padding-left: 18px; font-size: 0.88rem; color: #ddd; line-height: 1.7; }

        .rd-chip.missing { color: #fb7185; border-color: rgba(251,113,133,0.3); }
        .rd-chip.focus { color: #93c5fd; border-color: rgba(59,130,246,0.35); background: rgba(59,130,246,0.06); }

        .rd-feedback-card {
            background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-left: 3px solid var(--accent);
            border-radius: 10px; padding: 20px 22px; margin-bottom: 40px; font-size: 0.92rem; color: #ddd; line-height: 1.65;
        }

        @media (max-width: 640px) {
            .rd-project-grid { grid-template-columns: 1fr; }
            .rd-metric-grid { grid-template-columns: repeat(2, 1fr); }
            .rd-columns-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="landing-container">
        <div class="landing-title">AI.interviewer</div>
        <div class="landing-sub">System configuration</div>

        <!-- STEP 1: Resume Upload -->

                <label>📄 Upload Your Resume (Optional)</label>
                <input type="file" id="resume-file" accept=".pdf,.docx" style="width: 100%; padding: 12px; border: 1px solid var(--border-subtle); border-radius: 12px; background: var(--bg-elevated); color: white; cursor: pointer;">
            </div>
            <button class="start-btn" onclick="uploadResume()">Start Interview →</button>
        </div>

        <!-- STEP 2: Subject Selection -->
        <div id="subject-selection-section" style="display: none; margin-top: 20px;">
            <div class="form-group">
                <label>Subject Domain</label>
                <select id="subject-select">
                    <option value="">Select a Subject...</option>
                    <option value="OS">Operating Systems</option>
                    <option value="CN">Computer Networks</option>
                    <option value="DBMS">Database Management Systems</option>
                    <option value="DSA">Data Structures & Algorithms</option>

            <div class="form-group">

                <select id="topic-select">
                    <option value="All">Mixed Topics (Comprehensive)</option>
                    <option value="Process Management">Process Management</option>
                    <option value="Memory Management">Memory Management</option>
                    <option value="Deadlock">Deadlocks & Concurrency</option>
                    <option value="Scheduling">CPU Scheduling</option>

            <button class="start-btn" onclick="startInterview()">Initialize Session</button>

    <div id="chat-container">
        <div class="chat-header" id="chat-header-title">SYSTEM ACTIVE</div>
        <div id="messages"></div>
        <div class="input-area" id="input-area">
            <input type="text" id="user-input" placeholder="Enter response..." autocomplete="off">
            <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="Dictate">🎤</button>
            <button class="send-btn" id="send-btn" onclick="handleSubmission()">Send</button>

    </div>

    <div id="dashboard-container"></div>

    <!-- RESUME DISCUSSION (dedicated — isolated from #chat-container / #dashboard-container
         above, which the Technical/Adaptive Interview uses; kept fully separate so this
         redesign has zero visual or behavioral effect on that flow) -->
    <div id="rd-container">
        <div id="rd-header">
            <div id="rd-header-title">Resume Discussion</div>
            <div id="rd-progress-track"><div id="rd-progress-fill"></div></div>
            <div id="rd-progress-label">Getting started</div>
        </div>
        <div id="rd-messages"></div>
        <div class="input-area" id="rd-input-area">
            <input type="text" id="rd-user-input" placeholder="Share your answer..." autocomplete="off">
            <button class="send-btn" id="rd-send-btn" onclick="rdHandleSubmission()">Send</button>
        </div>
    </div>

    <div id="rd-report-container"></div>

    <!-- CANDIDATE ASSESSMENT DASHBOARD -->
    <div id="candidate-dashboard">
        <div class="dash-wrapper" id="dash-wrapper"></div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toast-container"></div>

    <script>
        let askedIds = [];
        let interviewHistory = []; 
        let currentDifficulty = "medium";
        let currentQuestionData = null;
        let stage = "main_question"; 
        let tempMainAnswer = "";
        let selectedTopic = "All";
        let parsedResumeData = null;  // Stores parsed resume for dashboard

        // ─── RESUME DISCUSSION STATE (dedicated — see #rd-container) ──
        let rdSessionId = null;
        let rdQuestionNum = 0;
        let rdTotalQuestions = 12;
        let rdCurrentCategory = "project_overview";
        // v2 migration: the v2 backend (conversation_engine.py) never returns
        // question/answer text on its own -- only metadata + evaluations. The
        // frontend already sees both as it renders them, so it accumulates
        // them here and zips them with each turn's real evaluation to build
        // the report client-side (see rdBuildReportFromV2).
        let rdTurnHistory = [];

        const landingContainer = document.getElementById("landing-container");
        const chatContainer = document.getElementById("chat-container");
        const dashboardContainer = document.getElementById("dashboard-container");
        const candidateDashboard = document.getElementById("candidate-dashboard");
        const dashWrapper = document.getElementById("dash-wrapper");
        const messagesDiv = document.getElementById("messages");
        const inputField = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const micBtn = document.getElementById("mic-btn");
        const chatHeader = document.getElementById("chat-header-title");

        const rdContainer = document.getElementById("rd-container");
        const rdMessages = document.getElementById("rd-messages");
        const rdInput = document.getElementById("rd-user-input");
        const rdSendBtn = document.getElementById("rd-send-btn");
        const rdProgressFill = document.getElementById("rd-progress-fill");
        const rdProgressLabel = document.getElementById("rd-progress-label");
        const rdReportContainer = document.getElementById("rd-report-container");

        // ─── TOAST NOTIFICATION HELPER ────────────────────────────────
        function showToast(message, type = "info", duration = 3500) {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add("toast-out");
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // ─── XSS ESCAPE HELPER ────────────────────────────────────────
        function esc(str) {
            if (str == null) return "";
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // ─── SKILL CATEGORIZATION ─────────────────────────────────────
        const SKILL_CATEGORIES = {
            "Languages": {
                exact: ["python","java","javascript","typescript","c","c++","c#","go","golang","rust","ruby","php","swift","kotlin","scala","r","matlab","perl","haskell","elixir","dart","sql","html","css","sass","scss","bash","shell","powershell","vba","objective-c","assembly","fortran","cobol","lua","groovy"],
                substring: ["python","java","javascript","typescript","golang","c++","c#","ruby","php","swift","kotlin","scala","matlab","perl","haskell","dart","bash","shell","powershell","vba","fortran","cobol","lua","groovy","rust","go "]
            },
            "Frameworks": {
                exact: ["react","reactjs","react.js","angular","angularjs","vue","vuejs","vue.js","next","nextjs","next.js","nuxt","nuxtjs","svelte","sveltejs","django","flask","fastapi","spring","spring boot","springboot"," express","expressjs","node","nodejs","node.js","rails","ruby on rails","laravel","symfony","ASP.NET","dotnet",".net","blazor","flutter","android","ios"," SwiftUI","tailwind","tailwindcss","bootstrap","jquery"],
                substring: ["react","angular","vue","next","nuxt","svelte","django","flask","fastapi","spring","express","node","rails","laravel","symfony","asp.net","dotnet","blazor","flutter","tailwind","bootstrap","jquery"]
            },
            "Tools": {
                exact: ["git","github","gitlab","bitbucket","docker","dockerfile","kubernetes","k8s","jenkins","travis","circleci","github actions","terraform","ansible","puppet","chef","vagrant","nginx","apache","tomcat","webpack","vite","npm","yarn","pip","conda","maven","gradle","ant","cmake","make","vim","neovim","emacs","vscode","intellij","eclipse","postman","swagger","figma","jira","confluence","trello","notion","slack","discord","linux","unix","macos","windows","ci/cd","devops","mlops"],
                substring: ["git","github","gitlab","bitbucket","docker","kubernetes","k8s","jenkins","travis","circleci","terraform","ansible","puppet","chef","vagrant","nginx","apache","tomcat","webpack","vite","npm","yarn","pip","conda","maven","gradle","cmake","postman","swagger","figma","jira","confluence","trello","notion","linux","unix","ci/cd","devops","mlops"]
            },
            "Databases": {
                exact: ["mysql","postgresql","postgres","sqlite","mongodb","mongo","redis","elasticsearch","elastic","cassandra","dynamodb","dynamo","couchdb","couchbase","neo4j","firebase","supabase","mariadb","oracle","sql server","mssql","cosmosdb","cosmos","influxdb","riak","memcached","etcd","cockroachdb","clickhouse","snowflake","bigquery","redshift","hbase","couchdb","realm","prisma","sequelize","typeorm","sqlalchemy","mongoose","knex","hibernate"],
                substring: ["mysql","postgresql","postgres","sqlite","mongodb","redis","elasticsearch","cassandra","dynamodb","couchdb","couchbase","neo4j","firebase","supabase","mariadb","oracle","cosmos","influx","riak","memcached","etcd","cockroach","clickhouse","snowflake","bigquery","redshift","hbase","realm","prisma","sequelize","typeorm","sqlalchemy","mongoose","knex","hibernate"]
            },
            "Cloud": {
                exact: ["aws","amazon web services","ec2","s3","lambda","ecs","eks","rds","sqs","sns","cloudfront","route53","azure","microsoft azure","gcp","google cloud","google cloud platform","heroku","netlify","vercel","digitalocean","linode","vultr","cloudflare","cloudrun","cloud functions","pubsub","bigtable","dataflow","dataproc","sagemaker","bedrock","openai api"],
                substring: ["aws","ec2","s3","lambda","ecs","eks","rds","sqs","sns","cloudfront","route53","azure","gcp","heroku","netlify","vercel","digitalocean","linode","cloudflare","cloudrun","sagemaker","bedrock"]
            }
        };

        function categorizeSkills(skills) {
            const result = {
                "Languages": [],
                "Frameworks": [],
                "Tools": [],
                "Databases": [],
                "Cloud": [],
                "Other": []
            };
            if (!Array.isArray(skills)) return result;

            const matched = new Set();

            for (const skill of skills) {
                const sLower = skill.toLowerCase().trim();
                let placed = false;

                // Pass 1: exact match
                for (const [cat, rules] of Object.entries(SKILL_CATEGORIES)) {
                    if (rules.exact.some(e => sLower === e.toLowerCase())) {
                        result[cat].push(skill);
                        matched.add(sLower);
                        placed = true;
                        break;
                    }
                }
                if (placed) continue;

                // Pass 2: substring match
                for (const [cat, rules] of Object.entries(SKILL_CATEGORIES)) {
                    if (rules.substring.some(s => sLower.includes(s) || s.includes(sLower))) {
                        result[cat].push(skill);
                        matched.add(sLower);
                        placed = true;
                        break;
                    }
                }
                if (placed) continue;

                result["Other"].push(skill);
            }
            return result;
        }

        // ─── CANDIDATE ASSESSMENT DASHBOARD RENDER FUNCTIONS ───────────

        function showCandidateDashboard(data) {
            parsedResumeData = data;

            // Hide landing, show dashboard
            landingContainer.style.opacity = "0";
            setTimeout(() => {
                landingContainer.style.display = "none";
                candidateDashboard.style.display = "block";
            }, 400);

            dashWrapper.innerHTML = "";
            dashWrapper.appendChild(renderDashGreeting(data));
            dashWrapper.appendChild(renderDashStatsGrid(data));
            dashWrapper.appendChild(renderDashSkills(data));
            dashWrapper.appendChild(renderDashInterviewPreview(data));
            dashWrapper.appendChild(renderDashStartButton());
        }

        function renderDashGreeting(data) {
            const el = document.createElement("div");
            const name = esc(data.name || "Candidate");
            el.innerHTML = `
                <div class="dash-greeting">Hello, ${name}</div>
                <div class="dash-subtitle">Here's your candidate assessment overview</div>
            `;
            return el;
        }

        function renderDashStatsGrid(data) {
            const el = document.createElement("div");
            el.className = "dash-grid";

            const domain = esc(data.predicted_domain || "N/A");
            const confidence = data.confidence ? (data.confidence * 100).toFixed(1) + "%" : "N/A";
            const years = data.experience ? (data.experience.years || 0) : 0;
            const level = esc(data.experience ? (data.experience.level || "Unknown") : "Unknown");
            const education = Array.isArray(data.education) && data.education.length > 0
                ? data.education.map(e => esc(typeof e === "string" ? e : (e.degree || e.major || JSON.stringify(e)))).join("<br>")
                : "N/A";
            const contactParts = [];
            if (data.email) contactParts.push(esc(data.email));
            if (data.phone) contactParts.push(esc(data.phone));
            const contact = contactParts.length > 0 ? contactParts.join("<br>") : "N/A";
            const projects = Array.isArray(data.projects) ? data.projects : [];

            const cards = [
                { label: "Domain", value: domain, primary: true },
                { label: "Confidence", value: confidence },
                { label: "Experience", value: `${years} years` },
                { label: "Level", value: level },
                { label: "Education", value: education, small: true },
                { label: "Contact", value: contact, small: true },
            ];

            cards.forEach((c, i) => {
                const card = document.createElement("div");
                card.className = "dash-card" + (c.small ? " dash-full" : "");
                card.innerHTML = `
                    <div class="dash-card-label">${esc(c.label)}</div>
                    <div class="dash-card-value${c.small ? ' small' : ''}"${c.primary ? ' style="color:#60a5fa;"' : ''}>${c.value}</div>
                `;
                el.appendChild(card);
            });

            const projCard = document.createElement("div");
            projCard.className = "dash-card dash-full";
            let projHtml = `<div class="dash-card-label">Projects (${projects.length})</div>`;
            if (projects.length === 0) {
                projHtml += `<div style="color:#666; font-size:0.9rem; margin-top:8px;">No projects detected in resume.</div>`;
            } else {
                projHtml += `<div style="margin-top:10px;">`;
                for (const p of projects) {
                    const title = esc(p.title || "Untitled Project");
                    const summary = esc(p.summary || "");
                    const techs = Array.isArray(p.technologies) ? p.technologies : [];
                    projHtml += `
                        <div style="margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid #2a2a3e;">
                            <div style="font-weight:600; color:#e2e8f0; font-size:0.95rem;">${title}</div>
                            ${summary ? `<div style="color:#94a3b8; font-size:0.85rem; margin-top:4px; line-height:1.4;">${summary}</div>` : ""}
                            ${techs.length > 0 ? `<div style="margin-top:6px;">${techs.map(t => `<span class="skill-chip sk-lang" style="font-size:0.75rem; margin-right:4px; margin-bottom:2px;">${esc(t)}</span>`).join("")}</div>` : ""}
                        </div>
                    `;
                }
                projHtml += `</div>`;
            }
            projCard.innerHTML = projHtml;
            el.appendChild(projCard);

            return el;
        }

        function renderDashSkills(data) {
            const el = document.createElement("div");
            el.className = "dash-card dash-full";
            el.style.marginBottom = "28px";

            const skills = Array.isArray(data.skills) ? data.skills : [];
            const cats = categorizeSkills(skills);

            const chipClassMap = {
                "Languages": "sk-lang",
                "Frameworks": "sk-framework",
                "Tools": "sk-tool",
                "Databases": "sk-db",
                "Cloud": "sk-cloud",
                "Other": "sk-other"
            };

            let html = `<div class="dash-card-label">Skills (${skills.length} detected)</div>`;

            if (skills.length === 0) {
                html += `<div style="color:#666; font-size:0.9rem; margin-top:8px;">No skills detected in resume.</div>`;
            } else {
                for (const [cat, catSkills] of Object.entries(cats)) {
                    if (catSkills.length === 0) continue;
                    html += `<div class="dash-category-label">${esc(cat)}</div>`;
                    html += `<div class="dash-skills-grid">`;
                    for (const s of catSkills) {
                        html += `<span class="skill-chip ${chipClassMap[cat] || ''}">${esc(s)}</span>`;
                    }
                    html += `</div>`;
                }
            }

            el.innerHTML = html;
            return el;
        }

        function renderDashInterviewPreview(data) {
            const el = document.createElement("div");
            el.className = "dash-card dash-full";
            el.style.marginBottom = "28px";

            const domain = esc(data.predicted_domain || "Software Engineering");
            const discussionDomain = esc(data.discussion_domain || "Software Engineer");
            const yearExp = data.experience ? (data.experience.years || 0) : 0;

            el.innerHTML = `
                <div class="dash-card-label">Interview Preview</div>
                <div class="dash-preview-box">
                    <strong>Resume Discussion:</strong> ${discussionDomain} &mdash; Conversational questions based on your projects, technologies, and experience.<br>
                    <strong>Adaptive Interview:</strong> ${domain} focus with ${yearExp > 0 ? yearExp + ' years' : 'your'} experience level. Questions adapt based on your responses.<br>
                    <strong>Evaluation:</strong> Semantic scoring + fill-in-the-blank verification. Results populate the final analytics dashboard.
                </div>
            `;
            return el;
        }

        function renderDashStartButton() {
            const el = document.createElement("div");
            el.innerHTML = `<button class="dash-start-btn" onclick="startDomainDiscussionFromDashboard()">Start Resume Discussion</button>`;
            return el;
        }

        function startDomainDiscussionFromDashboard() {
            candidateDashboard.style.display = "none";
            landingContainer.style.display = "none";
            rdMessages.innerHTML = "";
            rdQuestionNum = 0;

            rdContainer.style.display = "flex";
            rdContainer.style.opacity = "0";
            setTimeout(() => { rdContainer.style.opacity = "1"; }, 50);

            rdStartSession();
        }

        // ─── RESUME DISCUSSION — dedicated chat helpers ────────────────
        const RD_CATEGORY_LABELS = {
            "project_overview": "Project Overview",
            "project_deep_dive": "Project Deep Dive",
            "skill_in_context": "Skill in Context",
            "experience": "Experience",
            "certification": "Certification",
        };

        function rdCategoryLabel(cat) {
            return RD_CATEGORY_LABELS[cat] || "Discussion";
        }

        function rdUpdateProgress(num, total, category) {
            const pct = Math.min(100, Math.round((num / Math.max(total, 1)) * 100));
            rdProgressFill.style.width = pct + "%";
            rdProgressLabel.textContent = `Question ${num} of ~${total} \u2014 ${rdCategoryLabel(category)}`;
        }

        function rdAddMessage(text, sender, isHtml = false, categoryTag = null) {
            const wrapper = document.createElement("div");
            wrapper.className = `msg-wrapper ${sender}-wrapper`;

            const avatar = document.createElement("div");
            avatar.className = "avatar";
            avatar.innerHTML = sender === "bot" ? "AI" : "U";

            const msgDiv = document.createElement("div");
            msgDiv.className = `msg ${sender}-msg`;

            let inner = "";
            if (categoryTag) {
                inner += `<div class="rd-category-tag${categoryTag.followup ? " followup" : ""}">${esc(categoryTag.label)}</div>`;
            }
            inner += isHtml ? text : esc(text).replace(/\n/g, "<br>");
            msgDiv.innerHTML = inner;

            wrapper.appendChild(avatar);
            wrapper.appendChild(msgDiv);
            rdMessages.appendChild(wrapper);
            rdMessages.scrollTop = rdMessages.scrollHeight;
        }

        function rdShowTyping() {
            const wrapper = document.createElement("div");
            wrapper.className = "msg-wrapper bot-wrapper";
            wrapper.id = "rd-typing-box";
            wrapper.innerHTML = `<div class="avatar">AI</div><div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
            rdMessages.appendChild(wrapper);
            rdMessages.scrollTop = rdMessages.scrollHeight;
        }

        function rdHideTyping() {
            const box = document.getElementById("rd-typing-box");
            if (box) box.remove();
        }

        function rdDisableInput() {
            rdInput.disabled = true;
            rdSendBtn.disabled = true;
            rdInput.placeholder = "Thinking...";
        }

        function rdEnableInput() {
            rdInput.disabled = false;
            rdSendBtn.disabled = false;
            rdInput.placeholder = "Share your answer...";
            rdInput.focus();
        }

        function rdHandleSubmission() {
            if (rdInput.disabled) return;
            const text = rdInput.value.trim();
            if (!text) return;
            rdInput.value = "";
            rdHandleReply(text);
        }

        rdInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") rdHandleSubmission();
        });

        async function rdStartSession() {
            rdDisableInput();
            rdShowTyping();

            const sessionId = parsedResumeData ? (parsedResumeData.session_id || "") : "";

            try {
                const res = await fetch("/api/resume-discussion-v2/start", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: sessionId })
                });
                const data = await res.json();

                await sleep(600);
                rdHideTyping();

                if (data.error) {
                    rdAddMessage(data.error, "bot");
                    rdEnableInput();
                    return;
                }

                // v2's response shape: {status, conversation_id, question,
                // total_questions}. total_questions is the REAL planned pool
                // size for this profile (Planner.total(), session 12) -- not
                // an estimate, and not a fixed ceiling; question_num comes
                // from the question's own turn_number.
                rdSessionId = data.conversation_id;
                rdTotalQuestions = data.total_questions;
                rdQuestionNum = data.question.turn_number;
                rdCurrentCategory = data.question.category;
                rdTurnHistory = [{
                    question: data.question.text, category: data.question.category,
                    project_reference: data.question.project_reference, is_followup: false,
                    turn_number: data.question.turn_number, answer: null, evaluation: null,
                }];

                rdAddMessage(
                    "Let's talk through your background. I'll ask about your projects, experience, and technologies \u2014 take your time with each answer.",
                    "bot",
                );
                await sleep(400);

                rdUpdateProgress(rdQuestionNum, rdTotalQuestions, rdCurrentCategory);
                rdLoadQuestion(data.question, false);

            } catch (err) {
                rdHideTyping();
                console.error("Discussion start error:", err);
                rdAddMessage("Failed to start the discussion. Please try again.", "bot");
                rdEnableInput();
            }
        }

        function rdLoadQuestion(q, isFollowup) {
            rdAddMessage(q.text, "bot", false, {
                label: isFollowup ? "Follow-up" : rdCategoryLabel(q.category),
                followup: isFollowup,
            });
            rdEnableInput();
        }

        async function rdHandleReply(answer) {
            rdDisableInput();
            rdAddMessage(answer, "user");
            rdShowTyping();

            try {
                const res = await fetch("/api/resume-discussion-v2/reply", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: rdSessionId, answer: answer })
                });
                const data = await res.json();

                await sleep(700);
                rdHideTyping();

                if (data.error) {
                    rdAddMessage(data.error, "bot");
                    rdEnableInput();
                    return;
                }

                // Record this turn's real answer + real TrainedEvaluator result
                // against the pending entry pushed when its question was shown.
                const rdCurrentTurn = rdTurnHistory[rdTurnHistory.length - 1];
                if (rdCurrentTurn) {
                    rdCurrentTurn.answer = answer;
                    rdCurrentTurn.evaluation = data.evaluation;
                }

                if (data.is_completed) {
                    await sleep(600);
                    rdTriggerReport();
                    return;
                }

                if (data.next_question) {
                    // v2 has no top-level question_num/is_followup -- turn_number
                    // and next_question.is_followup are the equivalent fields.
                    rdQuestionNum = data.turn_number;
                    rdCurrentCategory = data.next_question.category;
                    rdUpdateProgress(rdQuestionNum, rdTotalQuestions, rdCurrentCategory);
                    rdTurnHistory.push({
                        question: data.next_question.text, category: data.next_question.category,
                        project_reference: data.next_question.project_reference,
                        is_followup: data.next_question.is_followup, turn_number: data.turn_number,
                        answer: null, evaluation: null,
                    });

                    await sleep(500);
                    rdLoadQuestion(data.next_question, data.next_question.is_followup);
                }

            } catch (err) {
                rdHideTyping();
                console.error("Discussion reply error:", err);
                rdAddMessage("Something went wrong processing that answer. Please try again.", "bot");
                rdEnableInput();
            }
        }

        async function rdTriggerReport() {
            rdDisableInput();
            rdShowTyping();

            try {
                const res = await fetch("/api/resume-discussion-v2/end", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: rdSessionId })
                });
                const data = await res.json();
                await sleep(500);
                rdHideTyping();

                rdContainer.style.opacity = "0";
                await sleep(400);
                rdContainer.style.display = "none";

                rdRenderReport(rdBuildReportFromV2(data, rdTurnHistory));

            } catch (err) {
                rdHideTyping();
                console.error("Discussion end error:", err);
                rdAddMessage("Failed to generate your discussion report.", "bot");
                rdEnableInput();
            }
        }

        // ─── v1 -> v2 report adapter (frontend-only; no backend change) ───
        // v1's discussion_engine.py used to compute this whole aggregated
        // report shape server-side. v2's evaluation_engine/conversation_engine
        // only expose a per-turn Evaluation Ledger (see _result_payload in
        // conversation_engine.py) -- so this function derives the SAME report
        // shape rdRenderReport already expects, from REAL data only:
        // per-turn EvaluationResult fields (dimensions/strengths/weaknesses/
        // recommended_topics) collected during the interview, plus the
        // session-level fields end_conversation() already returns. Fields v1
        // had that v2 has no honest equivalent for (personalized_feedback,
        // concept_coverage_avg, concepts_mastered/needing_review,
        // skills_not_demonstrated) are left absent/zero rather than invented
        // -- rdRenderReport already guards every one of these as optional.
        // Returns null (not 0) when `name` wasn't a relevant dimension for
        // this turn's reasoning_type (reasoning_dimension_relevance.py --
        // e.g. technical_depth is only relevant for 5 of 10 reasoning
        // types). Session 13 calibration fix: treating "not scored" as a
        // score of 0 was silently deflating session-level averages for any
        // dimension that isn't ALWAYS_RELEVANT -- this was a frontend
        // aggregation bug, not the model being harsh. The model/evaluator
        // itself is unchanged; only how already-present per-turn results
        // are averaged is corrected here.
        function rdDimScore(evaluation, name) {
            const d = evaluation && (evaluation.dimensions || []).find(x => x.name === name);
            return d ? d.raw_score : null;
        }

        function rdAvgDimensionPct(evaluations, name) {
            const scored = evaluations.map(e => rdDimScore(e, name)).filter(v => v !== null);
            if (!scored.length) return 0;
            return (scored.reduce((a, b) => a + b, 0) / scored.length) * 100;
        }

        // Improved Answer is generated server-side, deterministically, in
        // strong_answer.py (build_improved_answer) and delivered per turn as
        // evaluation.improved_answer -- null when hidden (already-strong
        // answer, or nothing concrete to add). It is a stronger rewrite of the
        // candidate's OWN answer: their response with repetition removed plus
        // grounded first-person additions for the missing concepts / weak
        // reasoning the evaluator flagged. DeBERTa is evaluation-only; the UI
        // just renders the string.
        function rdBuildReportFromV2(endData, turnHistory) {
            const evaluations = turnHistory.map(t => t.evaluation).filter(Boolean);
            const uniq = (arr) => Array.from(new Set(arr));

            const avgOverall = evaluations.length
                ? (evaluations.reduce((s, e) => s + (e.overall_score || 0), 0) / evaluations.length) * 100
                : 0;

            // Strongest/weakest project: grouped from this session's own
            // real per-turn scores, not fabricated.
            const byProject = {};
            turnHistory.forEach((t) => {
                if (!t.evaluation || !t.project_reference) return;
                (byProject[t.project_reference] = byProject[t.project_reference] || []).push(t.evaluation.overall_score || 0);
            });
            let strongestProject = null, weakestProject = null, bestAvg = -1, worstAvg = 2;
            Object.entries(byProject).forEach(([proj, scores]) => {
                const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
                if (avg > bestAvg) { bestAvg = avg; strongestProject = proj; }
                if (avg < worstAvg) { worstAvg = avg; weakestProject = proj; }
            });

            const timeline = turnHistory.map((t) => ({
                is_followup: t.is_followup,
                question_num: t.turn_number,
                category: t.category,
                score: t.evaluation ? t.evaluation.overall_score : 0,
                grade: t.evaluation ? t.evaluation.grade : "n/a",
                question: t.question,
                answer: t.answer || "",
                correctness: rdDimScore(t.evaluation, "technical_accuracy"),
                technical_depth: rdDimScore(t.evaluation, "technical_depth"),
                completeness: rdDimScore(t.evaluation, "completeness"),
                communication: rdDimScore(t.evaluation, "communication"),
                strengths: t.evaluation ? t.evaluation.strengths : [],
                weaknesses: t.evaluation ? t.evaluation.weaknesses : [],
                suggested_answer: (t.evaluation && t.evaluation.improved_answer) || null,
            }));

            // Concept Coverage: average ONLY turns that carry a value. The
            // backend sends evaluation.concept_coverage_pct (0-100) from the
            // shared lexical detector, or null when the turn has no concept
            // pool (experience/certification) -- those are excluded, not 0.
            const conceptPctValues = turnHistory
                .map(t => t.evaluation && t.evaluation.concept_coverage_pct)
                .filter(v => typeof v === "number");
            const conceptCoverageAvg = conceptPctValues.length
                ? conceptPctValues.reduce((a, b) => a + b, 0) / conceptPctValues.length
                : 0;

            return {
                average_answer_quality: avgOverall,
                communication_score: rdAvgDimensionPct(evaluations, "communication"),
                technical_depth: rdAvgDimensionPct(evaluations, "technical_depth"),
                project_understanding: rdAvgDimensionPct(evaluations, "technical_accuracy"),
                resume_authenticity: rdAvgDimensionPct(evaluations, "resume_grounding"),
                concept_coverage_avg: conceptCoverageAvg,
                technologies_demonstrated: endData.technologies_mentioned || [],
                concepts_mastered: [],
                concepts_needing_review: [],
                skills_not_demonstrated: [],
                recommended_focus: uniq(evaluations.flatMap(e => e.recommended_topics || [])),
                strongest_areas: uniq(evaluations.flatMap(e => e.strengths || [])),
                areas_to_improve: uniq(evaluations.flatMap(e => e.weaknesses || [])),
                strongest_project: strongestProject,
                weakest_project: weakestProject,
                personalized_feedback: null,
                projects_discussed: endData.projects_discussed || [],
                total_questions: endData.total_questions || turnHistory.length,
                timeline: timeline,
            };
        }

                { label: "Completeness", value: timeline.reduce((s, t) => s + (t.completeness || 0), 0) / Math.max(timeline.length, 1) * 100 },

            const improveListHtml = (data.areas_to_improve || []).map(s => `<li>${esc(s)}</li>`).join("") || "<li>No specific gaps flagged</li>";

                        <div class="rd-timeline-detail">
                            <div class="rd-timeline-detail-grid">
                                <div><div class="rd-timeline-metric-label">Correctness</div><div class="rd-timeline-metric-value">${((item.correctness || 0) * 100).toFixed(0)}%</div></div>
                                <div><div class="rd-timeline-metric-label">Technical Depth</div><div class="rd-timeline-metric-value">${((item.technical_depth || 0) * 100).toFixed(0)}%</div></div>
                                <div><div class="rd-timeline-metric-label">Completeness</div><div class="rd-timeline-metric-value">${((item.completeness || 0) * 100).toFixed(0)}%</div></div>
                                <div><div class="rd-timeline-metric-label">Communication</div><div class="rd-timeline-metric-value">${((item.communication || 0) * 100).toFixed(0)}%</div></div>
                            </div>
                            ${strengthsHtml ? `<div class="rd-timeline-metric-label">Strengths</div><ul class="rd-timeline-list">${strengthsHtml}</ul>` : ""}
                            ${weaknessesHtml ? `<div class="rd-timeline-metric-label">To improve</div><ul class="rd-timeline-list">${weaknessesHtml}</ul>` : ""}
                            ${item.suggested_answer ? `<div class="rd-timeline-metric-label" style="margin-bottom:6px;">Improved Answer</div><div class="rd-suggested-answer">${esc(item.suggested_answer)}</div>` : ""}
                        </div>
                        <div class="rd-expand-hint">Tap to expand details</div>
                    </div>
                `;
            });

            rdReportContainer.innerHTML = `
                <div class="rd-report-eyebrow">Resume Discussion &middot; Interview Report</div>
                <div class="rd-report-title">Your Discussion Report</div>

                <div class="rd-overall-card">
                    <div class="rd-overall-score" style="color:${perfColor}">${avg.toFixed(0)}%</div>
                    <div class="rd-overall-meta">
                        <div class="rd-overall-grade">${esc(gradeLabel)} overall performance</div>
                        <div class="rd-overall-sub">${data.total_questions || 0} questions discussed across ${(data.projects_discussed || []).length} project${(data.projects_discussed || []).length === 1 ? "" : "s"}</div>
                    </div>
                </div>

                <div class="rd-metric-grid">
                    ${secondaryMetrics.map(m => {
                        const color = m.value >= 75 ? "#34d399" : m.value >= 50 ? "#fbbf24" : "#fb7185";
                        return `<div class="rd-metric-card">
                            <div class="rd-metric-value" style="color:${color}">${(m.value || 0).toFixed(0)}%</div>
                            <div class="rd-metric-label">${esc(m.label)}</div>

                    }).join("")}

                <div class="rd-section-title">Skill Breakdown</div>

                    ${skillRows.map(s => {
                        const color = s.value >= 75 ? "#34d399" : s.value >= 50 ? "#fbbf24" : "#fb7185";
                        return `<div class="rd-skillbar">
                            <div class="rd-skillbar-head"><span>${esc(s.label)}</span><span>${s.value.toFixed(0)}%</span></div>

                ${missingSkillChips ? `<div class="rd-section-title">Skills Not Sufficiently Demonstrated</div><div class="rd-chip-row">${missingSkillChips}</div>` : ""}
